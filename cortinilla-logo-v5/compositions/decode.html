        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", "-200");
        r.setAttribute("y", (TOP + k * band).toFixed(2));
        r.setAttribute("width", "1480");
        r.setAttribute("height", (band + 0.6).toFixed(2));
        cp.appendChild(r);
        glitch.appendChild(cp);
        const gg = document.createElementNS(NS, "g");
        gg.setAttribute("clip-path", "url(#gb" + k + ")");
        const p = document.createElementNS(NS, "path");
        p.setAttribute("class", "logo-d");
        p.setAttribute("transform", "translate(" + LEFT + " " + TOP + ")");
        p.setAttribute("d", $("crisp").firstElementChild.getAttribute("d"));
        gg.appendChild(p);
        glitch.appendChild(gg);
        strips.push(gg);
      }

      const els = PX.map(function (_, i) { return [$("c" + i), $("g" + i + "a"), $("g" + i + "b")]; });
      const snap = function (v, o) { return o + Math.round((v - o) / G) * G; };

      // posición de un píxel: trayectoria en "L" por la retícula, en pasos de 20 px (movimiento digital)
      function pos(p, t) {
        const q = prog(t, p.go, p.go + MOVE);
        const a = p3io(prog(q, 0, 0.5)),
          b = p3io(prog(q, 0.5, 1));
        let x, y;
        if (p.xf) { x = lerp(p.sx, p.tx, a); y = lerp(p.sy, p.ty, b); }
        else { y = lerp(p.sy, p.ty, a); x = lerp(p.sx, p.tx, b); }
        return { x: snap(x, p.tx), y: snap(y, p.ty), moving: q > 0 && q < 1 };
      }

      function sweepX(k, t) {
        const s = SWEEPS[k];
        return lerp(LEFT - 24, LEFT + LW + 24, p2io(prog(t, s[0], s[1])));
      }
      function setClip(id, x0, x1) {
        const r = $(id);
        r.setAttribute("x", x0.toFixed(2));
        r.setAttribute("width", Math.max(0, x1 - x0).toFixed(2));
      }

      function render(t) {
        // ---- 0.00–1.20 · píxeles que aparecen parpadeando y viajan a su celda
        for (let i = 0; i < PX.length; i++) {
          const p = PX[i],
            e = els[i];
          if (t < p.on) {
            e[0].setAttribute("opacity", "0");
            e[1].setAttribute("opacity", "0");
            e[2].setAttribute("opacity", "0");
            continue;
          }
          const blink = t - p.on < 0.16 ? (Math.floor((t - p.on) * 40) % 2 === 0 ? 1 : 0.15) : 1;
          const c = pos(p, t),
            a = pos(p, t - 0.03),
            b = pos(p, t - 0.06);
          e[0].setAttribute("x", c.x);
          e[0].setAttribute("y", c.y);
          e[0].setAttribute("opacity", blink);
          e[1].setAttribute("x", a.x);
          e[1].setAttribute("y", a.y);
          e[1].setAttribute("opacity", c.moving ? 0.42 : 0);
          e[2].setAttribute("x", b.x);
          e[2].setAttribute("y", b.y);
          e[2].setAttribute("opacity", c.moving ? 0.18 : 0);
        }

        // ---- 1.36–2.46 · cuatro pasadas de escaneo: 20 → 10 → 5 → 2.5 px → vector
        const s = [0, 1, 2, 3].map(function (k) { return sweepX(k, t); });
        setClip("k0r", s[0], 4000);
        setClip("k1r", s[1], s[0]);
        setClip("k2r", s[2], s[1]);
        setClip("k3r", s[3], s[2]);
        setClip("k4r", -2000, s[3]);
        let active = -1;
        for (let k = 0; k < 4; k++) if (t >= SWEEPS[k][0] && t <= SWEEPS[k][1]) active = k;
        const scan = $("scan"),
          glow = $("scan-glow");
        if (active >= 0) {
          const x = s[active];
          scan.setAttribute("x", (x - 1.5).toFixed(2));
          scan.setAttribute("y", (TOP - 40).toFixed(2));
          scan.setAttribute("height", (LH + 80).toFixed(2));
          scan.setAttribute("opacity", "1");
          glow.setAttribute("x", (x - 34).toFixed(2));
          glow.setAttribute("y", (TOP - 40).toFixed(2));
          glow.setAttribute("height", (LH + 80).toFixed(2));
          glow.setAttribute("opacity", "0.12");
        } else {
          scan.setAttribute("opacity", "0");
          glow.setAttribute("opacity", "0");
        }

        // retícula de fondo: aparece con los datos y se apaga cuando el logotipo se resuelve
        const gridOp = 0.16 * prog(t, 0, 0.3) * (1 - p2io(prog(t, 1.4, 2.45)));
        $("gridbg").setAttribute("opacity", gridOp.toFixed(3));

        // ---- 2.50–2.64 · interferencia: franjas desplazadas y un eco, luego el logotipo se asienta
        const inG = t >= GLITCH[0] && t < GLITCH[1];
        glitch.setAttribute("opacity", inG ? "1" : "0");
        $("crisp").setAttribute("opacity", inG ? "0" : "1");
        if (inG) {
          const f = Math.floor((t - GLITCH[0]) * 60);
          for (let k = 0; k < STRIPS; k++) {
            const dx = (f % 3 === 2 ? 0 : 1) * 26 * Math.sin(k * 2.7 + f * 1.9) * (k % 2 ? 1 : -0.6);
            strips[k].setAttribute("transform", "translate(" + dx.toFixed(1) + " 0)");
          }
          $("gl-ghost").setAttribute("transform", "translate(" + (f % 2 ? 16 : -12) + " " + (f % 2 ? -4 : 3) + ")");
        }

        // ---- cámara: arranca cerca y se abre hasta el plano final
        const sc = lerp(1.22, 1, p2io(prog(t, 0, 2.5)));
        $("cam").setAttribute("transform", "translate(540 960) scale(" + sc.toFixed(4) + ") translate(-540 -960)");
        // 2.65–4.00 · el logotipo queda quieto, rosa sobre blanco
      }

      const clock = { t: 0 };
      render(0);
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: 4, duration: 4, ease: "none" }, 0);
      tl.eventCallback("onUpdate", function () {
        render(tl.time());
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["decode"] = tl;
    })();
  </script>
</template>
