<!doctype html>
<html
  lang="es"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Fondo","default":"#FFFFFF"},
    {"id":"color-accent","type":"color","label":"Rosa cívico","default":"#E4007C"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Cortinilla SOMOS · el logotipo se decodifica de píxeles a vector. 4 s, vertical; render 2160x3840 a 60 fps. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-fps="60" data-width="1080" data-height="1920">
      <div id="decode" class="clip" data-composition-id="decode" data-composition-src="compositions/decode.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Sonido (Pixabay, ver assets/sfx/CREDITS.md): textura digital mientras viajan los píxeles, un clic en cada
           pasada de escaneo (1.36, 1.66, 1.95, 2.22 s), glitch en la interferencia (2.50 s) y golpe suave al asentarse. -->
      <audio id="sfx-data" class="clip" src="assets/sfx/glitch-3.mp3" data-start="0" data-media-start="1.2" data-duration="1.9" data-track-index="3" data-volume="0.4" data-fade-in="0.15" data-fade-out="0.4"></audio>
      <audio id="sfx-scan1" class="clip" src="assets/sfx/click.mp3" data-start="1.287" data-duration="0.366" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-scan2" class="clip" src="assets/sfx/click-soft.mp3" data-start="1.587" data-duration="0.366" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-scan3" class="clip" src="assets/sfx/click.mp3" data-start="1.877" data-duration="0.366" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-scan4" class="clip" src="assets/sfx/click-soft.mp3" data-start="2.147" data-duration="0.366" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-glitch" class="clip" src="assets/sfx/glitch-1.mp3" data-start="2.42" data-media-start="0.4" data-duration="1.5" data-track-index="6" data-volume="0.45" data-fade-out="0.8"></audio>
      <audio id="sfx-settle" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="2.58" data-duration="1.42" data-track-index="7" data-volume="0.35" data-fade-out="0.6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
