<!doctype html>
<html
  lang="es"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Fondo","default":"#FFFFFF"},
    {"id":"color-accent","type":"color","label":"Rosa cívico","default":"#E4007C"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Cortinilla SOMOS · revelación del logotipo con esferas 3D. 4 s, vertical; render 2160x3840 a 60 fps. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-fps="60" data-motion-blur="on" data-motion-blur-events="on" data-width="1080" data-height="1920">
      <div id="reveal" class="clip" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Sonido (Pixabay, ver assets/sfx/CREDITS.md): pop cuando la esfera toca el piso (0.28 s), whoosh que cresta
           con el giro más rápido del carrusel (1.05 s), whoosh corto al formarse la línea y golpe al estallar en letras (2.10 s). -->
      <audio id="sfx-pop" class="clip" src="assets/sfx/pop.mp3" data-start="0.165" data-duration="0.72" data-track-index="4" data-volume="0.7"></audio>
      <audio id="sfx-spin" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="0" data-media-start="1.45" data-duration="2.6" data-track-index="5" data-volume="0.45" data-fade-in="0.4" data-fade-out="0.6"></audio>
      <audio id="sfx-line" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="1.74" data-duration="0.575" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-burst" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="2.04" data-duration="1.96" data-track-index="7" data-volume="0.5" data-fade-out="0.6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
