<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    /* Mosaico de la lona SOMOS (manual p. 67): cuadros rosa con pleca y cuadros blancos con el logotipo */
    #in-grid {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      transform-origin: 405px 840px;
    }
    .tl {
      position: absolute;
      width: 271px;
      height: 241px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tl.p {
      background: #e4007c;
    }
    .tl.w {
      background: #fff;
    }
    .tl.p img {
      width: 190px;
      height: auto;
    }
    .tl.w img {
      width: 150px;
      height: auto;
    }
    /* Cuadros rosa lisos: fondo de la pleca grande y salida hacia el conductor */
    #in-exit {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      opacity: 0;
    }
    .tx {
      position: absolute;
      width: 271px;
      height: 241px;
      background: #e4007c;
    }
    /* Pleca oficial con logotipo de 640 px, armado con sus 5 letras */
    #in-pleca {
      position: absolute;
      left: 116.5px;
      top: 842.85px;
      width: 847px;
      height: 234.3px;
      opacity: 0;
    }
    #in-plbg {
      position: absolute;
      left: 0;
      top: 0;
      width: 847px;
      height: 234.3px;
      border-radius: 117.15px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(120, 0, 60, 0.3);
    }
    #in-logo {
      position: absolute;
      left: 103.5px;
      top: 62.1px;
      width: 640px;
      height: 110.1px;
    }
    .in-box {
      position: absolute;
      top: 0;
      height: 110.1px;
      overflow: hidden;
    }
    .in-box img {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 110.1px;
    }
    #in-sheen {
      position: absolute;
      left: 0;
      top: 0;
      width: 640px;
      height: 110.1px;
      overflow: hidden;
      -webkit-mask-image: url("assets/brand/somos-logo-rosa.png");
      -webkit-mask-size: 100% 100%;
      mask-image: url("assets/brand/somos-logo-rosa.png");
      mask-size: 100% 100%;
    }
    #in-band {
      position: absolute;
      left: 0;
      top: -40px;
      width: 150px;
      height: 190px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 220, 238, 0.85) 50%, rgba(255, 255, 255, 0) 100%);
      transform: skewX(-20deg);
    }
    /* Línea blanca fina bajo la pleca (separadores del manual) */
    #in-rule {
      position: absolute;
      left: 140px;
      top: 1140px;
      width: 800px;
      height: 4px;
      background: #fff;
    }
  </style>
  <div id="root" data-composition-id="intro" data-width="1080" data-height="1920">
    <div id="in-grid" data-layout-ignore></div>
    <div id="in-exit" data-layout-ignore></div>
    <div id="in-rule" data-layout-ignore></div>
    <div id="in-pleca">
      <div id="in-plbg"></div>
      <div id="in-logo">
        <div id="in-b1" class="in-box" style="left: 0%; width: 17.3%"><img src="assets/brand/letra-s1.png" alt="S" /></div>
        <div id="in-b2" class="in-box" style="left: 18.5%; width: 18.95%"><img src="assets/brand/letra-o1.png" alt="O" /></div>
        <div id="in-b3" class="in-box" style="left: 37.7%; width: 24.55%"><img src="assets/brand/letra-m.png" alt="M" /></div>
        <div id="in-b4" class="in-box" style="left: 62.65%; width: 18.95%"><img src="assets/brand/letra-o2.png" alt="O" /></div>
        <div id="in-b5" class="in-box" style="left: 82.7%; width: 17.3%"><img src="assets/brand/letra-s2.png" alt="S" /></div>
        <div id="in-sheen" data-layout-ignore><div id="in-band"></div></div>
      </div>
    </div>
  </div>
  <script>
    // Mosaico 4 x 8 (cuadros de 270 x 240)
    const grid = document.querySelector("#in-grid");
    const exit = document.querySelector("#in-exit");
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 4; c++) {
        const pink = (r + c) % 2 === 0;
        const t = document.createElement("div");
        t.className = "tl " + (pink ? "p" : "w");
        t.style.left = c * 270 + "px";
        t.style.top = r * 240 + "px";
        const img = document.createElement("img");
        img.src = pink ? "assets/brand/pleca-somos.png" : "assets/brand/somos-logo-rosa.png";
        img.alt = "SOMOS";
        t.appendChild(img);
        grid.appendChild(t);
        const x = document.createElement("div");
        x.className = "tx";
        x.style.left = c * 270 + "px";
        x.style.top = r * 240 + "px";
        exit.appendChild(x);
      }
    }

    const tl = gsap.timeline({ paused: true });
    const HIT = 0.667; // golpe de tambor
    const IN = 2.0; // aparece el conductor
    const boxes = ["#in-b1", "#in-b2", "#in-b3", "#in-b4", "#in-b5"];

    // 1) El mosaico aparece cuadro por cuadro desde el centro
    tl.fromTo("#in-grid .tl", { scale: 0.45 }, { scale: 1, duration: 0.24, ease: "back.out(2)", stagger: { grid: [8, 4], from: "center", amount: 0.3 } }, 0);
    tl.fromTo("#in-grid .tl img", { scale: 0.4 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)", stagger: { grid: [8, 4], from: "center", amount: 0.3 } }, 0.06);
    // 2) La cámara entra a un cuadro rosa: queda la pleca grande sobre rosa
    tl.to("#in-grid", { scale: 7, x: 135, y: 120, duration: 0.3, ease: "power3.in" }, 0.42);
    tl.to("#in-grid", { opacity: 0, duration: 0.08, ease: "none" }, 0.64);
    tl.to("#in-exit", { opacity: 1, duration: 0.06, ease: "none" }, 0.62);
    tl.fromTo("#in-pleca", { opacity: 0, scale: 1.9 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, 0.62);
    boxes.forEach((b, i) => {
      tl.fromTo(`${b} img`, { yPercent: 110 }, { yPercent: 0, duration: 0.22, ease: "power4.out" }, 0.64 + i * 0.035);
    });
    tl.fromTo("#in-pleca", { x: 0, y: 0 }, { x: 10, y: -7, duration: 0.04, ease: "none", immediateRender: false }, HIT + 0.12);
    tl.to("#in-pleca", { x: -8, y: 5, duration: 0.05, ease: "none" }, HIT + 0.16);
    tl.to("#in-pleca", { x: 0, y: 0, duration: 0.06, ease: "none" }, HIT + 0.21);
    // 3) Efectos en las letras: línea, brillo y ola
    tl.fromTo("#in-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.9);
    tl.fromTo("#in-band", { x: -250 }, { x: 760, duration: 0.55, ease: "power2.inOut" }, 1.0);
    boxes.forEach((b, i) => {
      tl.to(b, { y: -22, duration: 0.12, ease: "power2.out" }, 1.3 + i * 0.05);
      tl.to(b, { y: 0, duration: 0.2, ease: "bounce.out" }, 1.42 + i * 0.05);
    });
    // 4) Salida: la pleca se recoge y el rosa se rompe en cuadros que revelan al conductor
    tl.to("#in-rule", { scaleX: 0, duration: 0.2, ease: "power3.in" }, 1.7);
    tl.to("#in-pleca", { scale: 0, duration: 0.24, ease: "back.in(1.8)" }, 1.74);
    tl.to("#in-exit .tx", { scale: 0, duration: 0.2, ease: "power2.in", stagger: { grid: [8, 4], from: "center", amount: 0.18 } }, IN);
    window.__timelines["intro"] = tl;
  </script>
</template>
