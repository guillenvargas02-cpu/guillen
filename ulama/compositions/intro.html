<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    /* Uso oficial del logotipo: rosa cívico sobre fondo blanco */
    #in-white {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      background: #fff;
    }
    #in-line {
      position: absolute;
      left: 130px;
      top: 1046px;
      width: 820px;
      height: 10px;
      border-radius: 5px;
      background: #e4007c;
    }
    /* Logotipo de 820 px armado con sus 5 letras (posiciones exactas del archivo oficial) */
    #in-logo {
      position: absolute;
      left: 130px;
      top: 889.5px;
      width: 820px;
      height: 141px;
      transform-origin: 229px 70.3px; /* centro del hueco de la primera O */
    }
    .in-box {
      position: absolute;
      top: 0;
      height: 141px;
      overflow: hidden;
    }
    .in-box img {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 141px;
    }
    #in-sheen {
      position: absolute;
      left: 0;
      top: 0;
      width: 820px;
      height: 141px;
      overflow: hidden;
      -webkit-mask-image: url("assets/brand/somos-logo-rosa.png");
      -webkit-mask-size: 100% 100%;
      mask-image: url("assets/brand/somos-logo-rosa.png");
      mask-size: 100% 100%;
    }
    #in-band {
      position: absolute;
      left: 0;
      top: -40px;
      width: 180px;
      height: 220px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.7) 50%, rgba(255, 255, 255, 0) 100%);
      transform: skewX(-20deg);
    }
  </style>
  <div id="root" data-composition-id="intro" data-width="1080" data-height="1920">
    <div id="in-white"></div>
    <div id="in-line" data-layout-ignore></div>
    <div id="in-logo">
      <div id="in-b1" class="in-box" style="left: 0%; width: 17.3%"><img src="assets/brand/letra-s1.png" alt="S" /></div>
      <div id="in-b2" class="in-box" style="left: 18.5%; width: 18.95%"><img src="assets/brand/letra-o1.png" alt="O" /></div>
      <div id="in-b3" class="in-box" style="left: 37.7%; width: 24.55%"><img src="assets/brand/letra-m.png" alt="M" /></div>
      <div id="in-b4" class="in-box" style="left: 62.65%; width: 18.95%"><img src="assets/brand/letra-o2.png" alt="O" /></div>
      <div id="in-b5" class="in-box" style="left: 82.7%; width: 17.3%"><img src="assets/brand/letra-s2.png" alt="S" /></div>
      <div id="in-sheen" data-layout-ignore><div id="in-band"></div></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const HIT = 0.667; // golpe de tambor
    const IN = 2.0; // aparece el conductor
    const boxes = ["#in-b1", "#in-b2", "#in-b3", "#in-b4", "#in-b5"];

    // 1) Una línea rosa se dibuja y de ella suben las letras, una por una
    tl.fromTo("#in-line", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power3.out" }, 0);
    boxes.forEach((b, i) => {
      tl.fromTo(`${b} img`, { yPercent: 105 }, { yPercent: 0, duration: 0.3, ease: "power4.out" }, 0.12 + i * 0.09);
    });
    tl.to("#in-line", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.25, ease: "power3.in" }, 0.5);

    // 2) Golpe en el tambor: el logotipo empuja hacia la cámara
    tl.fromTo("#in-logo", { scale: 1.09 }, { scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, HIT);
    tl.fromTo("#in-logo", { x: 0, y: 0 }, { x: 9, y: -6, duration: 0.04, ease: "none", immediateRender: false }, HIT);
    tl.to("#in-logo", { x: -7, y: 5, duration: 0.05, ease: "none" }, HIT + 0.04);
    tl.to("#in-logo", { x: 0, y: 0, duration: 0.06, ease: "none" }, HIT + 0.09);

    // 3) Brillo que recorre las letras y ola de letras
    tl.fromTo("#in-band", { x: -300 }, { x: 960, duration: 0.6, ease: "power2.inOut" }, 0.85);
    boxes.forEach((b, i) => {
      tl.to(b, { y: -30, duration: 0.14, ease: "power2.out" }, 1.3 + i * 0.055);
      tl.to(b, { y: 0, duration: 0.2, ease: "bounce.out" }, 1.44 + i * 0.055);
    });

    // 4) Entramos por la O: el logotipo crece hacia la cámara y, a través del hueco, aparece el conductor
    tl.to("#in-logo", { scale: 70, x: 181, duration: 0.55, ease: "power3.in" }, IN - 0.22); // la O se centra en pantalla
    tl.to("#in-white", { opacity: 0, duration: 0.12, ease: "none" }, IN);
    tl.set("#in-logo", { opacity: 0 }, IN + 0.33);
    window.__timelines["intro"] = tl;
  </script>
</template>
