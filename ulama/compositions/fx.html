<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    /* Barrido de cortinilla: franjas inclinadas (oro, rosa, obsidiana) que tapan el corte */
    .fx-bar {
      position: absolute;
      left: 0;
      top: -200px;
      height: 2320px;
      transform: skewX(-14deg);
    }
    .fx-gold {
      width: 260px;
      background: #f0b23a;
    }
    .fx-pink {
      width: 2200px;
      background: #e6087a;
    }
    .fx-dark {
      width: 200px;
      background: #140d0a;
    }
    #fx-flash {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      background: #fff8ec;
      opacity: 0;
    }
    #fx-leak {
      position: absolute;
      left: -500px;
      top: -200px;
      width: 1300px;
      height: 1300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 176, 80, 0.5) 0%, rgba(230, 8, 122, 0.18) 42%, rgba(230, 8, 122, 0) 70%);
      opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="fx" data-width="1080" data-height="1920">
    <div id="fx-leak" data-layout-ignore></div>
    <div id="fx-flash" data-layout-ignore></div>
    <div id="fx-a-gold" class="fx-bar fx-gold" data-layout-ignore></div>
    <div id="fx-a-pink" class="fx-bar fx-pink" data-layout-ignore></div>
    <div id="fx-a-dark" class="fx-bar fx-dark" data-layout-ignore></div>
    <div id="fx-b-gold" class="fx-bar fx-gold" data-layout-ignore></div>
    <div id="fx-b-pink" class="fx-bar fx-pink" data-layout-ignore></div>
    <div id="fx-b-dark" class="fx-bar fx-dark" data-layout-ignore></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.set(".fx-bar", { x: 4000 }, 0);
    // Barridos centrados en el paso a conductor (3.233) y al cierre (26.7).
    // La franja rosa cubre todo el cuadro unos fotogramas alrededor del corte.
    [
      ["a", 3.233],
      ["b", 26.7],
    ].forEach(([k, t]) => {
      // entra (acelerando) hasta cubrir, sostiene 2 fotogramas sobre el corte y sale (frenando)
      const I = 0.3, O = 0.34, h = 0.034;
      tl.fromTo(`#fx-${k}-gold`, { x: 1300 }, { x: -380, duration: I, ease: "power2.in", immediateRender: false }, t - h - I - 0.04);
      tl.to(`#fx-${k}-gold`, { x: -2700, duration: O, ease: "power2.out" }, t + h - 0.02);
      tl.fromTo(`#fx-${k}-pink`, { x: 1500 }, { x: -560, duration: I, ease: "power2.in", immediateRender: false }, t - h - I);
      tl.to(`#fx-${k}-pink`, { x: -3000, duration: O, ease: "power2.out" }, t + h);
      tl.fromTo(`#fx-${k}-dark`, { x: 3800 }, { x: 1700, duration: I, ease: "power2.in", immediateRender: false }, t - h - I + 0.04);
      tl.to(`#fx-${k}-dark`, { x: -900, duration: O, ease: "power2.out" }, t + h + 0.03);
    });
    // Destellos cortos en los saltos de plano del conductor (ritmo de jump-cut)
    [5.533, 8.567, 11.0, 12.833, 15.333, 17.533, 19.633, 22.933].forEach((t) => {
      tl.fromTo("#fx-flash", { opacity: 0.55 }, { opacity: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, t);
    });
    tl.set("#fx-flash", { opacity: 0 }, 23.2);
    // Luz cálida que cruza al inicio del conductor y en "somos México"
    [
      [3.3, 2.4],
      [22.95, 3.0],
    ].forEach(([t, d]) => {
      tl.fromTo("#fx-leak", { opacity: 0, x: 0, y: 0 }, { opacity: 1, x: 520, y: 160, duration: d * 0.5, ease: "sine.out", immediateRender: false }, t);
      tl.to("#fx-leak", { opacity: 0, x: 980, y: 300, duration: d * 0.5, ease: "sine.in" }, t + d * 0.5);
    });
    window.__timelines["fx"] = tl;
  </script>
</template>
