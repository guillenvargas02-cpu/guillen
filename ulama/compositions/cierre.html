  <script>
    // Local = video − 21.7. Voz: Somos (0.07) cultura (0.52) · somos (1.22) tradición (1.40) · y somos (2.30) México (2.62)
    const tl = gsap.timeline({ paused: true });
    const HIT = 3.767; // golpe final: cortinilla con el logotipo sobre blanco (25.467 s)
    const boxes = ["#cz-b1", "#cz-b2", "#cz-b3", "#cz-b4", "#cz-b5"];

    // "Somos": la pleca se abre y las letras suben
    tl.fromTo("#cz-plbg", { scaleX: 0.05, scaleY: 0.6 }, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "back.out(1.7)" }, 0.0);
    boxes.forEach((b, i) => {
      tl.fromTo(`${b} img`, { yPercent: 110 }, { yPercent: 0, duration: 0.26, ease: "power4.out" }, 0.12 + i * 0.05);
    });
    // Las letras saltan cada vez que dice "somos"
    function ripple(t) {
      boxes.forEach((b, i) => {
        tl.to(b, { y: -14, duration: 0.1, ease: "power2.out" }, t + i * 0.04);
        tl.to(b, { y: 0, duration: 0.18, ease: "bounce.out" }, t + 0.1 + i * 0.04);
      });
    }
    ripple(1.16);
    ripple(2.24);
    // La palabra cambia con un giro de máscara
    [
      ["#cz-w1", 0.46, 1.4],
      ["#cz-w2", 1.36, 2.52],
      ["#cz-w3", 2.52, 3.34],
    ].forEach(([w, a, b]) => {
      tl.set(w, { visibility: "visible" }, a);
      tl.set(w, { visibility: "hidden" }, b);
    });
    tl.fromTo("#cz-w1", { yPercent: 100 }, { yPercent: 0, duration: 0.28, ease: "power3.out" }, 0.46);
    tl.to("#cz-w1", { yPercent: -100, duration: 0.22, ease: "power3.in" }, 1.18);
    tl.fromTo("#cz-w2", { yPercent: 100 }, { yPercent: 0, duration: 0.28, ease: "power3.out" }, 1.36);
    tl.to("#cz-w2", { yPercent: -100, duration: 0.22, ease: "power3.in" }, 2.3);
    tl.fromTo("#cz-w3", { yPercent: 100 }, { yPercent: 0, duration: 0.28, ease: "power3.out" }, 2.52);
    tl.to("#cz-w3", { yPercent: -100, duration: 0.22, ease: "power3.in" }, 3.12);

    // Transición: la pleca sube al centro y crece
    tl.to("#cz-pleca", { y: -300.5, scale: 1.4542, duration: 0.42, ease: "power3.inOut" }, 3.02);
    // La franja blanca toma su lugar, se estira a todo lo ancho y luego se abre a pantalla completa
    tl.set("#cz-band", { visibility: "visible", scaleX: 0.7815 }, 3.44);
    tl.set("#cz-plbg", { opacity: 0 }, 3.44);
    tl.to("#cz-band", { scaleX: 1.08, duration: 0.14, ease: "power2.out" }, 3.44);
    tl.to("#cz-band", { scaleY: 8.8, duration: 0.2, ease: "power3.in" }, HIT - 0.2);
    // Las letras se separan con el whoosh y se cierran de golpe en el golpe de percusión
    const spread = [-70, -34, 0, 34, 70];
    boxes.forEach((b, i) => {
      tl.to(b, { x: spread[i], duration: 0.42, ease: "power2.in" }, HIT - 0.44);
      tl.to(b, { x: 0, duration: 0.32, ease: "power4.out" }, HIT);
    });
    tl.fromTo("#cz-logo", { scale: 1.12 }, { scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, HIT);
    // en el golpe el logotipo crece a casi todo el ancho (920 px)
    tl.to("#cz-pleca", { scale: 920 / 440, duration: 0.4, ease: "power4.out" }, HIT);
    tl.fromTo("#cz-pleca", { x: 0 }, { x: 8, duration: 0.04, ease: "none", immediateRender: false }, HIT);
    tl.to("#cz-pleca", { x: -6, duration: 0.05, ease: "none" }, HIT + 0.04);
    tl.to("#cz-pleca", { x: 0, duration: 0.06, ease: "none" }, HIT + 0.09);
    // Acercamiento lento y brillo sobre las letras
    tl.to("#cz-logo", { scale: 1.05, duration: 3.0, ease: "sine.out" }, HIT + 0.5);
    tl.fromTo("#cz-shine", { x: -200 }, { x: 560, duration: 0.7, ease: "power2.inOut" }, HIT + 0.9);
    tl.fromTo("#cz-shine", { x: -200 }, { x: 560, duration: 0.7, ease: "power2.inOut", immediateRender: false }, HIT + 2.1);
