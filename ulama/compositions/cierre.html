  <script>
    const grid = document.querySelector("#cz-grid");
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 4; c++) {
        const pink = (r + c) % 2 === 0;
        const t = document.createElement("div");
        t.className = "tl " + (pink ? "p" : "w");
        t.style.left = c * 270 + "px";
        t.style.top = r * 240 + "px";
        const img = document.createElement("img");
        img.src = pink ? "assets/brand/pleca-somos.png" : "assets/brand/somos-logo-rosa.png";
        img.alt = "SOMOS";
        t.appendChild(img);
        grid.appendChild(t);
      }
    }

    // Local = video − 21.7. Voz: Somos (0.07) cultura (0.52) · somos (1.22) tradición (1.40) · y somos (2.30) México (2.62)
    const tl = gsap.timeline({ paused: true });
    const HIT = 3.767; // golpe final (25.467 s)
    const small = ["#cz-b1", "#cz-b2", "#cz-b3", "#cz-b4", "#cz-b5"];
    const big = ["#cz-g1", "#cz-g2", "#cz-g3", "#cz-g4", "#cz-g5"];

    // "Somos": la pleca se abre y las letras suben; saltan con cada "somos"
    tl.fromTo("#cz-plbg", { scaleX: 0.05, scaleY: 0.6 }, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "back.out(1.7)" }, 0.0);
    small.forEach((b, i) => {
      tl.fromTo(`${b} img`, { yPercent: 110 }, { yPercent: 0, duration: 0.26, ease: "power4.out" }, 0.12 + i * 0.05);
    });
    function ripple(t) {
      small.forEach((b, i) => {
        tl.to(b, { y: -14, duration: 0.1, ease: "power2.out" }, t + i * 0.04);
        tl.to(b, { y: 0, duration: 0.18, ease: "bounce.out" }, t + 0.1 + i * 0.04);
      });
    }
    ripple(1.16);
    ripple(2.24);
    [
      ["#cz-w1", 0.46, 1.4],
      ["#cz-w2", 1.36, 2.52],
      ["#cz-w3", 2.52, 3.34],
    ].forEach(([w, a, b]) => {
      tl.set(w, { visibility: "visible" }, a);
      tl.set(w, { visibility: "hidden" }, b);
    });
    tl.fromTo("#cz-w1", { yPercent: 100 }, { yPercent: 0, duration: 0.28, ease: "power3.out" }, 0.46);
    tl.to("#cz-w1", { yPercent: -100, duration: 0.22, ease: "power3.in" }, 1.18);
    tl.fromTo("#cz-w2", { yPercent: 100 }, { yPercent: 0, duration: 0.28, ease: "power3.out" }, 1.36);
    tl.to("#cz-w2", { yPercent: -100, duration: 0.22, ease: "power3.in" }, 2.3);
    tl.fromTo("#cz-w3", { yPercent: 100 }, { yPercent: 0, duration: 0.28, ease: "power3.out" }, 2.52);
    tl.to("#cz-w3", { yPercent: -100, duration: 0.22, ease: "power3.in" }, 3.12);

    // Transición: la pleca sube y el mosaico de la lona cubre la pantalla, cuadro por cuadro
    tl.to("#cz-pleca", { y: -60, scale: 1.15, duration: 0.3, ease: "power2.out" }, 3.0);
    tl.set("#cz-grid .tl", { visibility: "visible" }, 3.05);
    tl.fromTo("#cz-grid .tl", { scale: 0 }, { scale: 1, duration: 0.2, ease: "back.out(2)", stagger: { grid: [8, 4], from: "end", amount: 0.38 } }, 3.05);
    tl.set("#cz-white", { visibility: "visible" }, 3.5);
    tl.set("#cz-pleca", { visibility: "hidden" }, 3.62);
    // Golpe final: los cuadros se van, queda el blanco y las letras de SOMOS se cierran de golpe
    tl.to("#cz-grid .tl", { scale: 0, duration: 0.16, ease: "power3.in", stagger: { grid: [8, 4], from: "center", amount: 0.1 } }, HIT - 0.2);
    tl.set("#cz-big", { visibility: "visible" }, HIT - 0.02);
    const spread = [-260, -130, 0, 130, 260];
    big.forEach((b, i) => {
      tl.fromTo(b, { x: spread[i] * 1.0, opacity: 0, scale: 1.5 }, { x: 0, opacity: 1, scale: 1, duration: 0.34, ease: "power4.out" }, HIT - 0.02 + Math.abs(i - 2) * 0.03);
    });
    tl.fromTo("#cz-big", { x: 0, y: 0 }, { x: 10, y: -7, duration: 0.04, ease: "none", immediateRender: false }, HIT + 0.05);
    tl.to("#cz-big", { x: -8, y: 5, duration: 0.05, ease: "none" }, HIT + 0.09);
    tl.to("#cz-big", { x: 0, y: 0, duration: 0.06, ease: "none" }, HIT + 0.14);
    // Marco rosa que se dibuja y línea bajo el logotipo
    const len = document.querySelector("#cz-frame-r").getTotalLength();
    tl.set("#cz-frame", { visibility: "visible" }, HIT);
    tl.fromTo("#cz-frame-r", { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, HIT + 0.05);
    tl.set("#cz-rule", { visibility: "visible" }, HIT + 0.35);
    tl.fromTo("#cz-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, HIT + 0.35);
    // Pulso de letras, brillo y acercamiento lento
    big.forEach((b, i) => {
      tl.to(b, { scale: 1.1, duration: 0.12, ease: "power2.out" }, HIT + 1.0 + i * 0.06);
      tl.to(b, { scale: 1, duration: 0.22, ease: "power2.inOut" }, HIT + 1.12 + i * 0.06);
    });
    tl.fromTo("#cz-shine", { x: -260 }, { x: 1100, duration: 0.8, ease: "power2.inOut" }, HIT + 1.6);
    tl.fromTo("#cz-big", { scale: 1 }, { scale: 1.04, duration: 2.0, ease: "sine.out", immediateRender: false }, HIT + 1.5);
