  <script>
    // Tiempos locales = tiempo del video − 2.0 (entra el conductor); palabras de timing.json
    const tl = gsap.timeline({ paused: true });
    function show(sel, t) {
      tl.set(sel, { visibility: "visible" }, t);
    }
    function popIc(sel, t) {
      show(sel, t);
      tl.fromTo(sel, { opacity: 0, scale: 0, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)" }, t);
      if (sel !== "#v-clock") {
        tl.fromTo(sel + " img", { scale: 0.5 }, { scale: 1, duration: 0.5, ease: "back.out(3)" }, t + 0.08);
      }
    }
    function popStk(sel, t, rot) {
      show(sel, t);
      tl.fromTo(sel, { opacity: 0, scale: 0, rotation: rot - 10 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.36, ease: "back.out(2.6)" }, t);
    }
    function out(sels, t) {
      tl.to(sels, { opacity: 0, scale: 0.3, duration: 0.18, ease: "power2.in" }, t - 0.18);
      tl.set(sels, { visibility: "hidden" }, t);
    }
    function bob(sel, t0, t1) {
      tl.to(sel, { y: -10, duration: (t1 - t0) / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, t0);
    }

    // ¿Quieres hacer algo que nunca habías visto?
    popStk("#v-q1", 0.15, -12);
    popStk("#v-q2", 0.35, 12);
    tl.to("#v-q1", { rotation: 8, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.55);
    tl.to("#v-q2", { rotation: -6, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.74);
    out(["#v-q1", "#v-q2"], 2.25);

    // 29 de noviembre (3.01) · domingo (4.23)
    popIc("#v-cal", 2.95);
    popStk("#v-cal-t1", 3.05, -3);
    popStk("#v-cal-t2", 3.2, 2);
    bob("#v-cal", 3.4, 4.5);
    out(["#v-cal", "#v-cal-t1", "#v-cal-t2"], 4.62);
    // 10 de la mañana (4.73)
    popIc("#v-clock", 4.6);
    tl.fromTo("#v-mh", { rotation: -720 }, { rotation: 0, duration: 0.9, ease: "power3.out" }, 4.62);
    tl.fromTo("#v-hh", { rotation: -150 }, { rotation: -60, duration: 0.9, ease: "power3.out" }, 4.62);
    popStk("#v-hr-t1", 4.68, -3);
    popStk("#v-hr-t2", 4.85, 2);
    out(["#v-clock", "#v-hr-t1", "#v-hr-t2"], 5.95);

    // ULAMA (7.47): la pelota rebota y entra al aro
    popIc("#v-aro", 6.9);
    show("#v-ball", 7.05);
    tl.set("#v-ball", { opacity: 1 }, 7.05);
    tl.fromTo("#v-ball", { x: -180, y: 600, rotation: 0 }, { x: 180, y: 380, rotation: 200, duration: 0.18, ease: "power1.out" }, 7.05);
    tl.to("#v-ball", { x: 380, y: 520, rotation: 330, duration: 0.14, ease: "power1.in" }, 7.23);
    tl.to("#v-ball", { x: 640, y: 160, rotation: 520, duration: 0.2, ease: "power1.out" }, 7.37);
    tl.to("#v-ball", { x: 795, y: 235, scale: 0.55, rotation: 600, duration: 0.12, ease: "power2.in" }, 7.57);
    tl.set("#v-ball", { opacity: 0 }, 7.7);
    tl.fromTo("#v-aro", { scale: 1 }, { scale: 1.15, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 7.69);
    popStk("#v-ulama", 7.45, -4);
    out(["#v-aro", "#v-ulama"], 7.95);
    tl.set("#v-ball", { visibility: "hidden" }, 7.95);

    // Juego de pelota (8.15) prehispánico (8.93)
    popIc("#v-jug", 8.05);
    popStk("#v-jug-t1", 8.15, -3);
    popStk("#v-jug-t2", 8.88, 2);
    out(["#v-jug", "#v-jug-t1", "#v-jug-t2"], 9.6);

    // Partido (10.25) de exhibición (10.67) y un taller (11.67)
    popIc("#v-atl", 10.2);
    popStk("#v-atl-t1", 10.25, -2);
    popStk("#v-atl-t2", 10.62, -3);
    popStk("#v-atl-t3", 11.62, 3);
    tl.fromTo("#v-atl img", { rotation: 0 }, { rotation: -8, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, 10.7);
    out(["#v-atl", "#v-atl-t1", "#v-atl-t2", "#v-atl-t3"], 12.25);

    // Familia (13.13) amigos (13.91)
    popStk("#v-fam", 13.08, -4);
    popStk("#v-ami", 13.86, 3);
    out(["#v-fam", "#v-ami"], 14.35);

    // Tradiciones (14.65) cultura mexicana (15.73)
    popIc("#v-sah", 14.6);
    popStk("#v-sah-t1", 14.65, -3);
    popStk("#v-sah-t2", 15.68, 2);
    [
      ["#v-s1", 14.8],
      ["#v-s2", 15.2],
      ["#v-s3", 15.6],
    ].forEach(([s, t]) => {
      tl.fromTo(s, { y: 0, scale: 0.5, opacity: 0 }, { y: -110, scale: 1.6, opacity: 1, duration: 0.5, ease: "sine.out" }, t);
      tl.to(s, { y: -200, scale: 2.2, opacity: 0, duration: 0.5, ease: "sine.in" }, t + 0.5);
    });
    out(["#v-sah", "#v-sah-t1", "#v-sah-t2"], 16.75);

    // Te esperamos (16.85)
    popStk("#v-esp", 16.8, -4);
    tl.to("#v-esp", { scale: 1.06, duration: 0.24, yoyo: true, repeat: 1, ease: "sine.inOut" }, 17.17);
    out("#v-esp", 17.85);

    // Mapa: este domingo (17.99) en el parque (18.69) de la reforma social
    show("#v-map", 17.88);
    tl.fromTo("#v-map", { opacity: 0, scale: 0.4, rotation: -8, y: 60 }, { opacity: 1, scale: 1, rotation: 0, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 17.88);
    tl.fromTo("#v-mapz", { scale: 1 }, { scale: 1.4, duration: 2.4, ease: "sine.inOut" }, 18.1);
    tl.fromTo("#v-pin", { y: -260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "bounce.out" }, 18.55);
    tl.fromTo("#v-pu1", { scale: 0.3, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, 19.0);
    tl.fromTo("#v-pu2", { scale: 0.3, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, 19.6);
    popStk("#v-map-t", 18.68, -2);
    out(["#v-map", "#v-map-t"], 20.75);
    window.__timelines["icons"] = tl;
