<!doctype html>

    <style>
      /* Capa gráfica de la invitación a ULAMA según el Manual de identidad SOMOS 2026:
         rosa cívico #E4007C y blanco; logotipo solo en positivo (rosa sobre blanco) o dentro de la pleca blanca;
         tipografía secundaria Hind Siliguri. El footage (4K) y el audio los arma build.py. */

        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>

    <div id="root" data-composition-id="main" data-start="0" data-duration="29.067" data-width="1080" data-height="1920">

</html>
