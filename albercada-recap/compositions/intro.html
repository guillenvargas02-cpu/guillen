  <script>
    (function () {
      const B = 2.22233 / 4; // un beat
      const title = document.getElementById("in-title");
      "Albercada".split("").forEach((c) => {
        const s = document.createElement("span");
        s.className = "l";
        s.textContent = c;
        title.appendChild(s);

      const L = title.querySelectorAll(".l");
      const tl = gsap.timeline({ paused: true });

      // 1) Pleca SOMOS sobre rosa → la pleca crece hasta llenar la pantalla (blanco) → aparece el evento
      tl.fromTo("#in-pleca", { scale: 0, rotation: -8 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2.2)" }, 0.02);

      tl.to("#in-pleca img", { opacity: 0, duration: 0.1 }, 0.55);
      tl.to("#in-pleca", { scale: 17, duration: 0.3, ease: "power3.in" }, 0.5);
      tl.set("#in-pink", { opacity: 0 }, 0.8);
      tl.set("#in-white", { opacity: 1 }, 0.8);
      tl.set("#in-pleca", { opacity: 0 }, 0.8);
      tl.to("#in-white", { opacity: 0, duration: 0.28, ease: "power2.out" }, 0.8);

      // 2) Título
      tl.to("#in-shade", { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.8);
      L.forEach((el, i) => {
        tl.fromTo(
          el,
          { opacity: 0, y: 90, scale: 0.3, rotation: -10 },
          { opacity: 1, y: 0, scale: 1, rotation: 0, duration: 0.26, ease: "back.out(2.6)" },
          0.92 + i * 0.08
        );
      });
      tl.fromTo("#in-ed", { opacity: 0, scale: 0.2, rotation: 8 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.3, ease: "back.out(2.4)" }, 3 * B + 0.05);
      // leve respiración del título mientras suenan las tomas rápidas
      tl.to("#in-title", { scale: 1.04, duration: 1.4, ease: "sine.inOut" }, 1.9);

      // 3) Salida del título (hacia arriba, en cascada) y cortinilla de franjas

        tl.to(el, { opacity: 0, y: -120, rotation: 8, duration: 0.2, ease: "power2.in" }, 3.45 + i * 0.025);
      });
      tl.to("#in-ed", { opacity: 0, scale: 0.4, duration: 0.18, ease: "power2.in" }, 3.55);
      tl.to("#in-shade", { opacity: 0, duration: 0.3 }, 3.55);

      const T = 2.22233 * 2; // 4.445 drop
      tl.to("#in-bar1", { x: 0, duration: 0.46, ease: "power3.in" }, T - 0.52);
      tl.to("#in-bar2", { x: 0, duration: 0.46, ease: "power3.in" }, T - 0.48);
      tl.to("#in-bar3", { x: 0, duration: 0.46, ease: "power3.in" }, T - 0.44);
      // salida: la franja rosa se va primero y deja ver las de abajo (rosa oscuro, blanco)

      tl.to("#in-bar2", { x: 3000, duration: 0.42, ease: "power3.out" }, T + 0.06);
      tl.to("#in-bar1", { x: 3000, duration: 0.42, ease: "power3.out" }, T + 0.1);
      window.__timelines["intro"] = tl;
    })();
