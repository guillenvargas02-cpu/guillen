<template>
  <style>
    #sc-root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #sc-all {
      position: absolute;
      inset: 0;
    }
    #sc-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 120% 70% at 50% 45%, #ef1a8c 0%, #e4007c 55%, #c9006d 100%);
      clip-path: circle(0% at 50% 50%);
    }
    #sc-stage {
      position: absolute;
      inset: 0;
      perspective: 1800px;
    }
    /* La nota: sin acercamientos ni subrayados, solo presencia */
    #sc-card {
      position: absolute;
      left: 50px;
      top: 592px;
      width: 980px;
      height: 735px;
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 40px 90px rgba(70, 0, 35, 0.42);
      opacity: 0;
    }
    #sc-card img {
      display: block;
      width: 980px;
      height: 735px;
    }
    #sc-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
    }
    .ph {
      position: absolute;
      border: 14px solid #fff;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 30px 60px rgba(70, 0, 35, 0.38);
      opacity: 0;
    }
    .ph img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
  <div id="sc-root" data-composition-id="showcase" data-width="1080" data-height="1920">
    <div id="sc-all">
      <div id="sc-bg"></div>
      <div id="sc-stage">
        <div id="sc-card"><img src="assets/img/nota-infopoder.png" alt="" /></div>
      </div>
      <div id="sc-photos"></div>
      <div id="sc-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const T0 = 16.9;
      const B = 2.22233 / 4;
      const NOTA = 17.12; // "un par de notas"
      const FOTOS = 35 * B; // 19.445 "un par de fotos"
      const at = (t) => t - T0;
      const tl = gsap.timeline({ paused: true });

      // Sale la nota (entra en 3D) y el rosa se abre detrás
      tl.fromTo(
        "#sc-card",
        { opacity: 0, y: 1150, rotationX: 34, rotation: -8, scale: 0.86 },
        { opacity: 1, y: 0, rotationX: 0, rotation: -2, scale: 1, duration: 0.55, ease: "power3.out" },
        at(NOTA)
      );
      tl.to("#sc-bg", { clipPath: "circle(120% at 50% 50%)", duration: 0.36, ease: "power2.out" }, at(NOTA));
      tl.to("#sc-card", { rotation: 0, y: -12, duration: FOTOS - NOTA - 0.55, ease: "sine.inOut" }, at(NOTA + 0.55));
      tl.to("#sc-card", { x: -1400, rotationY: -50, rotation: -8, duration: 0.3, ease: "power3.in" }, at(FOTOS - 0.2));

      // Salen las fotos: 4 fotos grandes, una cada 2 beats, y la protagonista a pantalla completa
      const P = [
        ["letrero", 520, 900, 700, 0.5625, -4],
        ["grupo-horizontal", 540, 1010, 960, 1.778, 3],
        ["mesa-larga", 565, 930, 700, 0.5625, 5],
        ["terraza-panoramica", 540, 880, 960, 1.778, -3],
      ];
      const box = document.getElementById("sc-photos");
      P.forEach(([name, cx, cy, w, ar, rot], k) => {
        const h = Math.round(w / ar);
        const el = document.createElement("div");
        el.className = "ph";
        el.style.left = cx - w / 2 + "px";
        el.style.top = cy - h / 2 + "px";
        el.style.width = w + "px";
        el.style.height = h + "px";
        el.style.zIndex = 2 + k;
        el.innerHTML = `<img src="assets/photos/${name}.jpg" alt="" />`;
        box.appendChild(el);
        const t = at(FOTOS + 2 * k * B);
        const dir = k % 2 ? 1 : -1;
        tl.fromTo(
          el,
          { opacity: 0, x: dir * 520, y: 60, scale: 1.12, rotation: rot + dir * 14 },
          { opacity: 1, x: 0, y: 0, scale: 1, rotation: rot, duration: 0.34, ease: "power3.out" },
          t
        );
        tl.fromTo(el.querySelector("img"), { scale: 1.12 }, { scale: 1.0, duration: 2 * B + 0.4, ease: "sine.out" }, t);
        tl.fromTo("#sc-flash", { opacity: 0.2 }, { opacity: 0, duration: 0.16, ease: "power1.out", immediateRender: false }, t + 0.05);
      });

      const fin = document.createElement("div");
      fin.className = "ph";
      fin.style.left = "0px";
      fin.style.top = "0px";
      fin.style.width = "1080px";
      fin.style.height = "1920px";
      fin.style.zIndex = 30;
      fin.innerHTML = '<img src="assets/photos/grupo-sonrisas.jpg" alt="" />';
      box.appendChild(fin);
      const tf = at(FOTOS + 7 * B);
      tl.set(fin, { opacity: 1 }, tf);
      tl.fromTo(
        fin,
        { scale: 0.5, rotation: -4, borderWidth: 28 },
        { scale: 1, rotation: 0, borderWidth: 0, duration: 0.42, ease: "power3.inOut", immediateRender: false },
        tf
      );
      tl.set(fin, { borderRadius: 0 }, tf + 0.42);
      tl.to(fin.querySelector("img"), { scale: 1.06, duration: 1.2, ease: "none" }, tf);
      tl.to("#sc-all", { y: -1920, duration: 0.27, ease: "power3.in" }, at(11 * 2.22233 - 0.27));
      window.__timelines["showcase"] = tl;
    })();
  </script>
</template>
