<template>
  <style>
    #sc-root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #sc-all {
      position: absolute;
      inset: 0;
    }
    #sc-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 120% 70% at 50% 45%, #ef1a8c 0%, #e4007c 55%, #c9006d 100%);
      clip-path: circle(0% at 50% 50%);
    }
    #sc-stage {
      position: absolute;
      inset: 0;
      perspective: 1800px;
    }
    /* La nota: sin acercamientos ni subrayados, solo presencia */
    #sc-card {
      position: absolute;
      left: 50px;
      top: 592px;
      width: 980px;
      height: 735px;
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 40px 90px rgba(70, 0, 35, 0.42);
      opacity: 0;
    }
    #sc-card img {
      display: block;
      width: 980px;
      height: 735px;
    }
    #sc-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
    }
    .ph {
      position: absolute;
      border: 14px solid #fff;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 30px 60px rgba(70, 0, 35, 0.38);
      opacity: 0;
    }
    .ph img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
  <div id="sc-root" data-composition-id="showcase" data-width="1080" data-height="1920">
    <div id="sc-all">
      <div id="sc-bg"></div>
      <div id="sc-stage">
        <div id="sc-card"><img src="assets/img/nota-infopoder.png" alt="" /></div>
      </div>
      <div id="sc-photos"></div>
      <div id="sc-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const T0 = 16.9;
      const B = 2.22233 / 4;
      const NOTA = 17.12; // "un par de notas"
      const FOTOS = 8 * 2.22233; // 17.779 "un par de fotos"
      const BREAK = 9 * 2.22233; // 20.001 regresa la persona
      const at = (t) => t - T0;
      const tl = gsap.timeline({ paused: true });

      // Sale la nota (entra en 3D) y el rosa se abre detrás; se queda debajo de las fotos
      tl.fromTo(
        "#sc-card",
        { opacity: 0, y: 1150, rotationX: 34, rotation: -8, scale: 0.86 },
        { opacity: 1, y: 0, rotationX: 0, rotation: -2, scale: 1, duration: 0.45, ease: "power3.out" },
        at(NOTA)
      );
      tl.to("#sc-bg", { clipPath: "circle(120% at 50% 50%)", duration: 0.32, ease: "power2.out" }, at(NOTA));
      tl.to("#sc-card", { rotation: 0, scale: 0.96, duration: BREAK - NOTA - 0.45, ease: "sine.out" }, at(NOTA + 0.45));

      // Salen las fotos: 4, una por beat, encima de la nota
      const P = [
        ["letrero", 300, 860, 520, 0.5625, -6],
        ["grupo-horizontal", 560, 1200, 880, 1.778, 3],
        ["mesa-larga", 790, 880, 520, 0.5625, 6],
        ["grupo-sonrisas", 540, 980, 600, 0.5625, -2],
      ];
      const box = document.getElementById("sc-photos");
      P.forEach(([name, cx, cy, w, ar, rot], k) => {
        const h = Math.round(w / ar);
        const el = document.createElement("div");
        el.className = "ph";
        el.style.left = cx - w / 2 + "px";
        el.style.top = cy - h / 2 + "px";
        el.style.width = w + "px";
        el.style.height = h + "px";
        el.style.zIndex = 2 + k;
        el.innerHTML = `<img src="assets/photos/${name}.jpg" alt="" />`;
        box.appendChild(el);
        const t = at(FOTOS + k * B);
        const dir = k % 2 ? 1 : -1;
        tl.fromTo(
          el,
          { opacity: 0, x: dir * 420, y: 50, scale: 1.15, rotation: rot + dir * 14 },
          { opacity: 1, x: 0, y: 0, scale: 1, rotation: rot, duration: 0.28, ease: "power3.out" },
          t
        );
        tl.fromTo(el.querySelector("img"), { scale: 1.1 }, { scale: 1.0, duration: 1.2, ease: "sine.out" }, t);
        tl.fromTo("#sc-flash", { opacity: 0.18 }, { opacity: 0, duration: 0.14, ease: "power1.out", immediateRender: false }, t + 0.04);
      });

      // La capa sube y regresa la persona (mitad de la frase, la boca va con su voz)
      tl.to("#sc-all", { y: -1920, duration: 0.27, ease: "power3.in" }, at(BREAK - 0.27));
      window.__timelines["showcase"] = tl;
    })();
  </script>
</template>
