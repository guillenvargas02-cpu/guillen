      // patrón de plecas

      // 1) La nota entra (sobre la persona) y el fondo rosa se abre detrás

        "#sc-card",
        { opacity: 0, y: 1250, rotationX: 38, rotation: -9, scale: 0.86 },

      tl.to("#sc-m1", { scaleX: 1, duration: 0.3, ease: "power2.out" }, at(19.05));
      tl.to("#sc-m2", { scaleX: 1, duration: 0.3, ease: "power2.out" }, at(19.4));
      // 3) Zoom a la foto de la nota (obturador)
      tl.to("#sc-chip", { opacity: 0, y: -60, duration: 0.25, ease: "power2.in" }, at(20.2));
      tl.to("#sc-card", { scale: 1.9, y: -124, duration: 0.55, ease: "power3.inOut" }, at(20.22));
      tl.fromTo("#sc-flash", { opacity: 0.5 }, { opacity: 0, duration: 0.28, ease: "power1.out", immediateRender: false }, at(20.55));

        ["anfitriones", 785, 1060, 470, 0.5625, -6],
        ["mesa-larga", 320, 720, 470, 0.5625, -8],
        ["cierre-cielo", 765, 1360, 470, 0.5625, 7],
        ["terraza-panoramica", 540, 1500, 900, 1.778, 3],
      ];
      const box = document.getElementById("sc-photos");
      const t0 = 22.57;
      P.forEach(([name, cx, cy, w, ar, rot], k) => {
        const h = Math.round(w / ar);
        const el = document.createElement("div");
        el.className = "ph";
        el.style.left = cx - w / 2 + "px";
        el.style.top = cy - h / 2 + "px";
        el.style.width = w + "px";
        el.style.height = h + "px";
        el.style.zIndex = 2 + k;

        const t = at(t0 + k * B);
        tl.fromTo(el, { opacity: 0, scale: 1.45, rotation: rot + (k % 2 ? 12 : -12), y: -40 }, { opacity: 1, scale: 1, rotation: rot, y: 0, duration: 0.22, ease: "power3.out" }, t);

      tl.set(fin, { borderRadius: 0 }, tf + 0.42);
