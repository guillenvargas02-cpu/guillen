<template>
  <style>
    #fn-root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    /* Cortinilla blanca: una franja rosa delante y el blanco detrás, en diagonal */
    #fn-wipe {
      position: absolute;
      left: -900px;
      top: -900px;
      width: 2880px;
      height: 3720px;
      transform: rotate(-14deg);
    }
    .fn-bar {
      position: absolute;
      left: 0;
      top: 0;
      width: 2880px;
      height: 3720px;
      transform: translateX(-3000px);
    }
    #fn-bar1 { background: #e4007c; }
    #fn-bar2 { background: #ffffff; }
    #fn-white {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
    }
    /* Logo SOMOS (vector del manual), una capa por letra */
    #fn-logo {
      position: absolute;
      left: 150px;
      top: 880px;
      width: 780px;
      height: 134px;
    }
    #fn-mask {
      position: absolute;
      left: -40px;
      top: -30px;
      width: 860px;
      height: 194px;
      overflow: hidden;
    }
    #fn-mask img {
      position: absolute;
      left: 40px;
      top: 30px;
      width: 780px;
      height: 134px;
    }
  </style>
  <div id="fn-root" data-composition-id="finale" data-width="1080" data-height="1920">
    <div id="fn-wipe">
      <div id="fn-bar1" class="fn-bar"></div>
      <div id="fn-bar2" class="fn-bar"></div>
    </div>
    <div id="fn-white"></div>
    <div id="fn-logo">
      <div id="fn-mask">
        <img class="fn-l" src="assets/brand/somos-l1.svg" alt="S" />
        <img class="fn-l" src="assets/brand/somos-l2.svg" alt="O" />
        <img class="fn-l" src="assets/brand/somos-l3.svg" alt="M" />
        <img class="fn-l" src="assets/brand/somos-l4.svg" alt="O" />
        <img class="fn-l" src="assets/brand/somos-l5.svg" alt="S" />
      </div>
    </div>
  </div>
  <script>
    (function () {
      const T0 = 30.8;
      const MEX = 13 * 2.22233 - 0.1 + (2.8 - 0.62); // 30.970 "…somos México"
      const at = (t) => t - T0;
      const tl = gsap.timeline({ paused: true });

      // Cortinilla: entra en "somos", cubre en "México"
      tl.to("#fn-bar1", { x: 0, duration: 0.36, ease: "power3.in" }, at(MEX - 0.05));
      tl.to("#fn-bar2", { x: 0, duration: 0.36, ease: "power3.in" }, at(MEX + 0.02));
      tl.set("#fn-white", { opacity: 1 }, at(MEX + 0.38));

      // El logo se arma: cada letra sube desde abajo con un pequeño rebote, en cascada
      const L = document.querySelectorAll(".fn-l");
      const CX = [8.9, 28.1, 50.0, 72.1, 91.1]; // centro de cada letra (% del ancho del logo)
      L.forEach((el, k) => {
        gsap.set(el, { transformOrigin: CX[k] + "% 60%" });
        tl.fromTo(
          el,
          { y: 190, rotation: k % 2 ? -10 : 10, scaleY: 1.25 },
          { y: 0, rotation: 0, scaleY: 1, duration: 0.42, ease: "back.out(2.1)" },
          at(MEX + 0.36 + k * 0.075)
        );
      });
      // golpe final: el logo completo da un pequeño "punch" y luego respira hasta el último cuadro
      tl.fromTo("#fn-logo", { scale: 1 }, { scale: 1.07, duration: 0.12, ease: "power2.out", immediateRender: false }, at(MEX + 0.78));
      tl.to("#fn-logo", { scale: 1, duration: 0.35, ease: "back.out(2)" }, at(MEX + 0.9));
      tl.to("#fn-logo", { scale: 1.04, duration: 3.3, ease: "sine.out" }, at(MEX + 1.25));
      window.__timelines["finale"] = tl;
    })();
  </script>
</template>
