<template>
  <style>

      position: absolute;

    .fn-ring {

    /* Juego con el logo sobre rosa */
    #fn-pink {
      position: absolute;

    }
    #fn-pat {

      width: 230px;

    #fn-entre {

    #fn-slot {
      position: absolute;

    #fn-strip {

    #fn-strip div {

    }
    /* Logo final sobre blanco */
    #fn-white {
      position: absolute;

      background: #fff;
      opacity: 0;
      z-index: 6;
    }
    #fn-lock {
      position: absolute;

      clip-path: inset(0 100% 0 0);
    }
  </style>
  <div id="fn-root" data-composition-id="finale" data-width="1080" data-height="1920">
    <div id="fn-lb1" class="fn-lb"></div>
    <div id="fn-lb2" class="fn-lb"></div>
    <div id="fn-shade"></div>
    <div id="fn-rings"></div>
    <div id="fn-words"></div>
    <div id="fn-conf"></div>
    <div id="fn-pink"><div id="fn-pat"></div></div>
    <div id="fn-entre">Entre amigos,</div>
    <div id="fn-pleca" class="pleca"><img src="assets/brand/somos.svg" alt="SOMOS" /></div>
    <div id="fn-slot"><div id="fn-strip"></div></div>
    <div id="fn-flash"></div>
    <div id="fn-white"></div>
    <div id="fn-lock">
      <img id="fn-logo" src="assets/brand/lockup-logo.svg" alt="SOMOS" />
      <img id="fn-lema" src="assets/brand/lockup-lema.svg" alt="La fuerza que nos une" />
    </div>
  </div>
  <script>
    (function () {
      const T0 = 30.2;
      const B = 2.22233 / 4;
      const DROP = 14 * 2.22233; // 31.113
      const LOGO = 16.5 * 2.22233; // 36.668
      const WHITE = 18 * 2.22233; // 40.002
      const at = (t) => t - T0;
      const tl = gsap.timeline({ paused: true });

      // Tensión antes del drop: franjas rosas (letterbox) que se cierran y se abren de golpe
      tl.to(".fn-lb", { height: 150, duration: 0.5, ease: "power2.in" }, at(DROP - 0.55));
      tl.to(".fn-lb", { height: 0, duration: 0.14, ease: "power3.out" }, at(DROP));
      tl.fromTo("#fn-flash", { opacity: 0.55 }, { opacity: 0, duration: 0.26, ease: "power1.out", immediateRender: false }, at(DROP));
      tl.to("#fn-shade", { opacity: 1, duration: 0.3 }, at(DROP));

      // Frases SOMOS: una cada 2 beats
      const WORDS = ["Diversión", "Albercada", "Amigos", "El futuro", "México"];
      const wrap = document.getElementById("fn-words");
      const rings = document.getElementById("fn-rings");
      tl.fromTo("#fn-pleca", { opacity: 0, scale: 0, rotation: -14 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.26, ease: "back.out(3)" }, at(DROP));
      WORDS.forEach((w, k) => {
        const t = at(DROP + 2 * k * B);
        const el = document.createElement("div");
        el.className = "fn-w" + (k === 4 ? " big" : "");
        el.textContent = w;
        wrap.appendChild(el);
        const r = document.createElement("div");
        r.className = "fn-ring";
        rings.appendChild(r);
        tl.fromTo(r, { opacity: 0.8, scale: 0.35 }, { opacity: 0, scale: 2.1, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
        if (k > 0) tl.fromTo("#fn-pleca", { scale: 1.14 }, { scale: 1, duration: 0.24, ease: "back.out(3)", immediateRender: false }, t);
        tl.fromTo(el, { opacity: 0, y: 110, scale: 1.35 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "back.out(2)" }, t + 0.03);
        if (k < 4) tl.to(el, { opacity: 0, y: -90, scale: 0.85, duration: 0.14, ease: "power2.in" }, t + 2 * B - 0.1);
      });
      // México: confeti rosa y blanco
      const conf = document.getElementById("fn-conf");
      const tm = at(DROP + 8 * B);
      for (let i = 0; i < 26; i++) {
        const c = document.createElement("div");
        c.className = "fn-conf";
        c.style.left = 528 + "px";
        c.style.top = 1300 + "px";
        c.style.background = i % 3 === 0 ? "#ffffff" : i % 3 === 1 ? "#e4007c" : "#ff7ab8";
        conf.appendChild(c);
        const ang = (i / 26) * Math.PI * 2 + (i % 5) * 0.13;
        const d = 380 + ((i * 97) % 260);
        tl.fromTo(
          c,
          { opacity: 1, x: 0, y: 0, rotation: 0, scale: 0.6 },
          { x: Math.cos(ang) * d, y: Math.sin(ang) * d * 0.8 + 160, rotation: 360 + i * 40, scale: 1, duration: 1.1, ease: "power2.out", immediateRender: false },
          tm + 0.02
        );
        tl.to(c, { opacity: 0, duration: 0.3 }, tm + 0.8);
      }

      // Juego con el logo: el rosa se abre desde la pleca, la pleca sube y las palabras ruedan
      const pat = document.getElementById("fn-pat");
      for (let r = 0; r < 26; r++) {
        for (let c = 0; c < 9; c++) {
          const p = document.createElement("div");
          p.className = "pleca";
          p.style.left = c * 290 + (r % 2) * 145 + "px";
          p.style.top = r * 128 + "px";
          p.innerHTML = '<img src="assets/brand/somos.svg" alt="" />';
          pat.appendChild(p);
        }
      }
      tl.fromTo(pat, { x: 0, y: 0 }, { x: -290, y: -128, duration: 7, ease: "none" }, at(LOGO));
      tl.to("#fn-pink", { clipPath: "circle(130% at 50% 65%)", duration: 0.4, ease: "power2.out" }, at(LOGO - 0.02));
      tl.to(".fn-w", { opacity: 0, duration: 0.15 }, at(LOGO));
      tl.to("#fn-shade", { opacity: 0, duration: 0.2 }, at(LOGO));
      tl.to("#fn-pleca", { y: -350, rotation: 0, scale: 1.08, duration: 0.4, ease: "power3.inOut" }, at(LOGO));

      const strip = document.getElementById("fn-strip");
      const SLOT = ["Amigos", "Jóvenes", "Diversión", "Futuro", "México", "Más"];
      SLOT.forEach((w) => {
        const d = document.createElement("div");
        d.textContent = w;
        strip.appendChild(d);
      });
      tl.fromTo("#fn-slot", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, at(LOGO + 0.08));
      SLOT.forEach((w, k) => {
        if (k === 0) return;
        tl.to(strip, { y: -170 * k, duration: 0.2, ease: "back.out(1.6)" }, at(LOGO + k * B));
      });
      // "Entre amigos, SOMOS más" (la frase de la invitación) en el último beat
      tl.fromTo("#fn-entre", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, at(LOGO + 5 * B));
      tl.to("#fn-pleca", { scale: 1.16, duration: 0.2, ease: "back.out(3)" }, at(LOGO + 5 * B));

      // Logo final sobre blanco: la pleca crece hasta cubrir la pantalla
      tl.to(["#fn-entre", "#fn-slot"], { opacity: 0, y: -50, duration: 0.18, ease: "power2.in" }, at(WHITE - 0.2));
      tl.to("#fn-pleca img", { opacity: 0, duration: 0.07 }, at(WHITE - 0.27));
      tl.to("#fn-pleca", { scale: 16, duration: 0.28, ease: "power3.in" }, at(WHITE - 0.26));
      tl.set("#fn-white", { opacity: 1 }, at(WHITE + 0.02));
      tl.fromTo("#fn-lock", { opacity: 0, scale: 0.72 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, at(WHITE + 0.04));
      tl.to("#fn-lema", { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.out" }, at(WHITE + 0.45));
      tl.to("#fn-lock", { scale: 1.035, duration: 3.4, ease: "sine.out" }, at(WHITE + 0.55));
      window.__timelines["finale"] = tl;
    })();
  </script>
</template>
