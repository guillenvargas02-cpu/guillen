<!doctype html>
<html
  lang="es"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Fondo","default":"#FFFFFF"},
    {"id":"color-accent","type":"color","label":"Rosa cívico","default":"#E4007C"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Cortinilla SOMOS · el líquido rosa se solidifica en el logotipo. 4 s, vertical; render 2160x3840 a 60 fps. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-fps="60" data-motion-blur="on" data-motion-blur-events="on" data-width="1080" data-height="1920">
      <div id="liquid" class="clip" data-composition-id="liquid" data-composition-src="compositions/liquid.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Sonido (Pixabay, ver assets/sfx/CREDITS.md): whoosh de las gotas que entran, pop del choque (0.38 s),
           whoosh largo que cresta con el giro, whoosh corto al formarse la barra y golpe al solidificarse (2.55 s). -->
      <audio id="sfx-in" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.14" data-duration="0.575" data-track-index="3" data-volume="0.5"></audio>
      <audio id="sfx-hit" class="clip" src="assets/sfx/pop.mp3" data-start="0.26" data-duration="0.72" data-track-index="4" data-volume="0.75"></audio>
      <audio id="sfx-swirl" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="0" data-media-start="1.5" data-duration="2.6" data-track-index="5" data-volume="0.42" data-fade-in="0.5" data-fade-out="0.6"></audio>
      <audio id="sfx-bar" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="1.69" data-duration="0.575" data-track-index="6" data-volume="0.35"></audio>
      <audio id="sfx-solid" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="2.48" data-duration="1.52" data-track-index="7" data-volume="0.45" data-fade-out="0.6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
