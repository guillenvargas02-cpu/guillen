<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Capa gráfica del teaser. El footage y la canción los arma build.py con ffmpeg
         y luego compone esta capa encima. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Poppins", sans-serif;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="34.5" data-width="1080" data-height="1920">
      <!-- Cortes en los beats de la canción (103 BPM); el golpe de 1:40.15 cae en 29.10 s -->

      window.__timelines["main"] = gsap.timeline({ paused: true });
