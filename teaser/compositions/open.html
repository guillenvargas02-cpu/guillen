  <script>
    const tl = gsap.timeline({ paused: true });
    // Texto que se "decodifica" letra por letra (determinista)
    const scramble = (el, text, start, dur) => {
      const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#/";
      const p = { v: 0 };
      tl.fromTo(p, { v: 0 }, { v: 1, duration: dur, ease: "none", onUpdate: () => {
        const n = Math.floor(p.v * text.length);
        const step = Math.floor(p.v * 24);
        el.textContent = text.split("").map((c, i) => (i < n || c === " " ? c : glyphs[(i * 7 + step * 13) % glyphs.length])).join("");
      } }, start);
    };
    scramble(document.querySelector("#op-k"), "BITÁCORA DE EXPEDICIÓN", 0, 0.7);
    tl.fromTo("#op-t", { scaleY: 0.2, opacity: 0.4 }, { scaleY: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 0);

    tl.fromTo("#op-s", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.6);
    tl.to(["#op-k", "#op-t", "#op-s"], { opacity: 0, y: -30, duration: 0.18, ease: "power2.in" }, 2.18);
    window.__timelines["open"] = tl;
