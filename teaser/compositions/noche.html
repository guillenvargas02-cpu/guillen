    const tl = gsap.timeline({ paused: true });
    // Texto que se "decodifica" letra por letra (determinista)
    const scramble = (el, text, start, dur) => {
      const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const p = { v: 0 };
      tl.fromTo(p, { v: 0 }, { v: 1, duration: dur, ease: "none", onUpdate: () => {
        const n = Math.floor(p.v * text.length);
        const step = Math.floor(p.v * 24);
        el.textContent = text.split("").map((c, i) => (i < n || c === " " ? c : glyphs[(i * 7 + step * 13) % glyphs.length])).join("");
      } }, start);
    };
    const el = document.querySelector("#nn-txt");
    const full = "ESTA NOCHE";
    const q = { v: 0 };
    tl.fromTo(q, { v: 0 }, { v: 1, duration: 1.0, ease: "none", onUpdate: () => { el.textContent = full.slice(0, Math.round(q.v * full.length)); } }, 0.15);
    tl.fromTo("#nn-cur", { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "steps(1)", yoyo: true, repeat: 6 }, 0.1);
    tl.fromTo("#nn-rec", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "steps(1)", yoyo: true, repeat: 4 }, 0.0);
    tl.fromTo("#nn-t", { scale: 1 }, { scale: 1.06, duration: 1.9, ease: "power1.in" }, 0.1);
