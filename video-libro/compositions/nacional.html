<template>
  <style>
    /* "a nivel nacional": el mapa se llena en una onda desde la Ciudad de México */
    #root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse 90% 60% at 50% 48%, #2a1040 0%, #12071c 55%, #07030b 100%); }
    #na-glow { position: absolute; left: 40px; top: 420px; width: 1000px; height: 1000px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 230, 0, 0.22) 0%, rgba(255, 230, 0, 0) 62%); }
    #na-map { position: absolute; left: 0; top: 0; width: 793px; height: 498px; transform-origin: 0 0; }
    #na-title { position: absolute; left: 0; top: 330px; width: 1080px; text-align: center; }
    #na-k { font-weight: 800; font-size: 34px; letter-spacing: 0.4em; color: rgba(255, 255, 255, 0.85); }
    #na-t { font-weight: 900; font-size: 104px; line-height: 1; letter-spacing: -0.01em; color: #ffe600; margin-top: 14px; text-shadow: 0 10px 40px rgba(0, 0, 0, 0.45); }
  </style>
  <div id="root" data-composition-id="nacional" data-width="1080" data-height="1920">
    <div id="na-glow"></div>
    <div id="na-map"></div>
    <div id="na-title"><div id="na-k">DISTRIBUCIÓN</div><div id="na-t">A NIVEL NACIONAL</div></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const { paths } = MXKit.build(document.getElementById("na-map"), "na", { fill: "rgba(255,255,255,0.06)", stroke: "rgba(255,255,255,0.35)", strokeWidth: 1.2 });
    const S = 1.3;
    gsap.set("#na-map", { scale: S, x: 540 - 397 * S, y: 1000 - 249 * S });
    tl.fromTo("#na-map", { scale: S * 0.92, x: 540 - 397 * S * 0.92, y: 1000 - 249 * S * 0.92, opacity: 0 }, { scale: S, x: 540 - 397 * S, y: 1000 - 249 * S, opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
    tl.to("#na-map", { scale: S * 1.04, x: 540 - 397 * S * 1.04, y: 1000 - 249 * S * 1.04, duration: 0.85, ease: "sine.inOut" }, 0.35);
    const c0 = MXKit.center("cmx");
    Object.entries(paths).forEach(([id, p]) => {
      const [x, y] = MXKit.center(id);
      const d = Math.hypot(x - c0[0], y - c0[1]);
      const t = 0.06 + d / 420 * 0.6;
      tl.fromTo(p, { attr: { fill: "rgba(255,255,255,0.06)" } }, { attr: { fill: "#ffe600" }, duration: 0.08, ease: "none", immediateRender: false }, t);
      tl.to(p, { attr: { fill: "#7d35a0" }, duration: 0.3, ease: "power1.out" }, t + 0.08);
    });
    tl.fromTo("#na-title", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 0.08);
    tl.fromTo("#na-t", { scale: 1.25 }, { scale: 1, duration: 0.35, ease: "power3.out" }, 0.08);
    tl.fromTo("#na-glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1.1, duration: 1.0, ease: "sine.out" }, 0.1);
    window.__timelines["nacional"] = tl;
  </script>
</template>
