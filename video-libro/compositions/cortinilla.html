  <script>
    const tl = gsap.timeline({ paused: true });
    let seed = 1211;
    const rnd = () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    // polvo dorado
    const db = document.getElementById("co-dustbox");
    for (let i = 0; i < 40; i++) {
      const d = document.createElement("div");
      d.className = "co-dust";
      const s = 3 + rnd() * 6;
      d.style.cssText = `left:${(rnd() * 1080).toFixed(0)}px;top:${(rnd() * 1920).toFixed(0)}px;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;opacity:${(0.25 + rnd() * 0.55).toFixed(2)};filter:blur(${(rnd() * 2.5).toFixed(1)}px)`;
      db.appendChild(d);
      tl.fromTo(d, { x: 0, y: 0 }, { x: (rnd() - 0.5) * 90, y: -80 - rnd() * 160, duration: 5.8, ease: "none" }, 0);
    }
    // barrido de papel: entra desde abajo a la derecha, cubre y sigue de largo
    tl.fromTo("#co-paper", { x: 1500, y: 900 }, { x: -2600, y: -1500, duration: 0.85, ease: "power2.inOut" }, 0);
    tl.fromTo(["#co-bg", "#co-g", "#co-r", "#co-dustbox"], { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.4);
    tl.fromTo(["#co-g", "#co-r"], { scale: 0.85 }, { scale: 1.12, duration: 5.4, ease: "sine.out" }, 0.4);
    // "12"
    tl.fromTo("#co-numbox", { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.01 }, 0.4);
    tl.fromTo("#co-num", { y: 140, scale: 0.92, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "power4.out" }, 0.5);
    tl.to("#co-num", { scale: 1.04, duration: 4.5, ease: "sine.inOut" }, 1.2);
    tl.fromTo("#co-shine", { x: 0 }, { x: 1500, duration: 1.0, ease: "power2.inOut" }, 1.05);
    tl.fromTo("#co-month", { opacity: 0, scaleX: 1.35 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.75);
    tl.fromTo("#co-line", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 0.9);
    tl.fromTo("#co-dia", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.05);
    // firma: libro + Gandhi
    tl.fromTo("#co-book", { opacity: 0, y: 80, rotation: -6 }, { opacity: 1, y: 0, rotation: -2, duration: 0.6, ease: "back.out(1.6)" }, 2.1);
    tl.fromTo(["#co-title", "#co-avail", "#co-logo"], { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, stagger: 0.12, ease: "power3.out" }, 2.25);
    window.__timelines["cortinilla"] = tl;
  </script>
