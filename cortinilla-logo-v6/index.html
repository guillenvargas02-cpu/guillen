<!doctype html>
<html
  lang="es"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Fondo","default":"#FFFFFF"},
    {"id":"color-accent","type":"color","label":"Rosa cívico","default":"#E4007C"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Cortinilla SOMOS · código binario que se compila en el logotipo. 4 s, vertical; render 2160x3840 a 60 fps. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-fps="60" data-width="1080" data-height="1920">
      <div id="binary" class="clip" data-composition-id="binary" data-composition-src="compositions/binary.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Sonido (Pixabay, ver assets/sfx/CREDITS.md): ráfaga de tecleo durante la lluvia de código, whoosh que cresta
           cuando la cámara se abre (1.35 s), glitch en la compilación (2.18 s) y golpe al fundirse en el logotipo (2.32 s). -->
      <audio id="sfx-code" class="clip" src="assets/sfx/typing.mp3" data-start="0" data-duration="1.541" data-track-index="3" data-volume="0.55" data-fade-out="0.3"></audio>
      <audio id="sfx-pull" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="0" data-media-start="1.15" data-duration="2.3" data-track-index="4" data-volume="0.45" data-fade-in="0.4" data-fade-out="0.5"></audio>
      <audio id="sfx-compile" class="clip" src="assets/sfx/glitch-1.mp3" data-start="1.95" data-media-start="0.25" data-duration="1.4" data-track-index="5" data-volume="0.4" data-fade-out="0.7"></audio>
      <audio id="sfx-solid" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="2.25" data-duration="1.75" data-track-index="6" data-volume="0.5" data-fade-out="0.6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
