<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    #g-wrap {
      position: absolute;
      inset: 0;
      mix-blend-mode: overlay;
      opacity: 0.1;
    }
    #g-wrap img {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="grano" data-width="1080" data-height="1920">
    <div id="g-all" class="clip" data-start="0" data-duration="36.2232" style="position: absolute; inset: 0" data-layout-ignore>
      <div id="g-wrap">
        <img class="g" src="assets/fx/grano-0.jpg" alt="" />
        <img class="g" src="assets/fx/grano-1.jpg" alt="" />
        <img class="g" src="assets/fx/grano-2.jpg" alt="" />
        <img class="g" src="assets/fx/grano-3.jpg" alt="" />
        <img class="g" src="assets/fx/grano-4.jpg" alt="" />
        <img class="g" src="assets/fx/grano-5.jpg" alt="" />
      </div>
    </div>
  </div>
  <script>
    // Grano animado a 15 Hz: el fotograma visible es función del tiempo (seek-safe)
    const tl = gsap.timeline({ paused: true });
    const frames = Array.from(document.querySelectorAll("#g-wrap .g"));
    const clock = { t: 0 };
    tl.to(clock, {
      t: 36.2232,
      duration: 36.2232,
      ease: "none",
      onUpdate: () => {
        const i = Math.floor(clock.t * 15) % frames.length;
        frames.forEach((f, k) => (f.style.opacity = k === i ? "1" : "0"));
      },
    }, 0);
    window.__timelines["grano"] = tl;
  </script>
</template>
