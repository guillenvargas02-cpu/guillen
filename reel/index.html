<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Capa gráfica del reel. El footage y el audio los arma build.py con ffmpeg
         (cortes a 29.97 fps exactos, sin fotogramas repetidos) y luego compone esta capa encima. */
      :root {
        --brand: #e6087a;
        --green: #1e6b34;
        --navy: #0e1a35;
        --ink: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Poppins", sans-serif;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="33.2"
      data-width="1080"
      data-height="1920"
    >
      <!-- Cortes en los beats de la música (~96 BPM); el drop entra en 9.47 s -->
      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3.78" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="3.78" data-duration="5.69" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="drop" class="clip" data-composition-id="drop" data-composition-src="compositions/drop.html" data-start="9.47" data-duration="1.88" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="glaciar" class="clip" data-composition-id="glaciar" data-composition-src="compositions/glaciar.html" data-start="11.35" data-duration="3.79" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="placa" class="clip" data-composition-id="placa" data-composition-src="compositions/placa.html" data-start="15.14" data-duration="3.16" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="climb" class="clip" data-composition-id="climb" data-composition-src="compositions/climb.html" data-start="18.30" data-duration="5.06" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="cima" class="clip" data-composition-id="cima" data-composition-src="compositions/cima.html" data-start="23.36" data-duration="2.53" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 7"></div>
      <div id="hicimos" class="clip" data-composition-id="hicimos" data-composition-src="compositions/hicimos.html" data-start="25.89" data-duration="4.41" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 9"></div>
      <div id="logo" class="clip" data-composition-id="logo" data-composition-src="compositions/logo.html" data-start="29.68" data-duration="3.52" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 8"></div>
      <div id="flashes" class="clip" data-composition-id="flashes" data-composition-src="compositions/flashes.html" data-start="0" data-duration="33.2" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 20"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
