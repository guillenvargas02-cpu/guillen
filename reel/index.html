<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Capa gráfica del reel. El footage y el audio los arma build.py con ffmpeg
         (cortes a 29.97 fps exactos, sin fotogramas repetidos) y luego compone esta capa encima. */
      :root {
        --brand: #e6087a;
        --green: #1e6b34;
        --navy: #0e1a35;
        --ink: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Poppins", sans-serif;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="34.82"
      data-width="1080"
      data-height="1920"
    >
      <!-- Cortes en los beats de la música (~96 BPM) -->
      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5.12" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="5.12" data-duration="6.94" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="territorio" class="clip" data-composition-id="territorio" data-composition-src="compositions/territorio.html" data-start="12.06" data-duration="3.79" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="glaciar" class="clip" data-composition-id="glaciar" data-composition-src="compositions/glaciar.html" data-start="15.85" data-duration="3.78" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="placa" class="clip" data-composition-id="placa" data-composition-src="compositions/placa.html" data-start="19.63" data-duration="5.09" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="porque" class="clip" data-composition-id="porque" data-composition-src="compositions/porque.html" data-start="24.72" data-duration="3.76" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="hicimos" class="clip" data-composition-id="hicimos" data-composition-src="compositions/hicimos.html" data-start="28.48" data-duration="3.77" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 8"></div>
      <div id="logo" class="clip" data-composition-id="logo" data-composition-src="compositions/logo.html" data-start="31.63" data-duration="3.19" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 7"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
