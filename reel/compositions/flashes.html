  <style>
    #root {

      inset: 0;
    }
    #flash-white {
      position: absolute;
      left: 0;

  <script>
    const tl = gsap.timeline({ paused: true });
    tl.set("#flash-white", { opacity: 0 }, 0);
    // Destellos en los golpes fuertes: el drop y la entrada a cada foto de escalada
    [
      [9.47, 0.9],
      [18.3, 0.6],
      [19.57, 0.75],
      [21.45, 0.75],
      [23.36, 0.75],
    ].forEach(([t, a]) => {
      tl.set("#flash-white", { opacity: a }, t);
      tl.to("#flash-white", { opacity: 0, duration: 0.28, ease: "power2.out" }, t + 0.001);
    });
    window.__timelines["flashes"] = tl;
  </script>
