<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "Poppins", sans-serif;
    }
    .cap {
      position: absolute;
      left: 0;
      width: 1080px;
      top: 1130px;
      padding: 0 90px;
      text-align: center;
      font-size: 80px;
      line-height: 1.12;
      font-weight: 800;
      text-transform: uppercase;
      color: #fff;
      opacity: 0;
      overflow: visible;
      text-shadow: 0 0 2px #0e1a35, 0 4px 0 #0e1a35, 0 6px 24px rgba(0, 0, 0, 0.6);
    }
    .cap .w {
      display: inline-block;
    }
    .cap .w.hl {
      color: #ec1c7f;
    }
  </style>
  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
    <!-- Transcripción de IMG_1015 con tiempos ya ajustados a los cortes -->
    <div id="cap-1" class="cap"><span class="w" data-t="0.1">Bueno,</span></div>
    <div id="cap-2" class="cap"><span class="w" data-t="1.15">estamos</span> <span class="w" data-t="1.5">por</span> <span class="w" data-t="1.75">empezar</span></div>
    <div id="cap-3" class="cap"><span class="w" data-t="2.5">nuestro</span> <span class="w" data-t="2.95">recorrido</span> <span class="w" data-t="3.75">al</span> <span class="w hl" data-t="3.95">Izta</span></div>
    <div id="cap-4" class="cap"><span class="w" data-t="4.75">y</span> <span class="w" data-t="4.9">vamos</span> <span class="w" data-t="5.2">allá</span></div>
    <div id="cap-5" class="cap"><span class="w" data-t="5.65">a</span> <span class="w" data-t="5.75">ver</span> <span class="w" data-t="5.95">qué</span> <span class="w" data-t="6.15">nos</span> <span class="w hl" data-t="6.3">depara</span></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const groups = [
      ["#cap-1", 0.1, 0.95],
      ["#cap-2", 1.1, 2.4],
      ["#cap-3", 2.45, 4.7],
      ["#cap-4", 4.7, 5.6],
      ["#cap-5", 5.6, 6.75],
    ];
    groups.forEach(([sel, start, end]) => {
      const g = document.querySelector(sel);
      tl.set(g, { opacity: 1, visibility: "visible" }, start);
      // Cada palabra entra cuando se dice
      g.querySelectorAll(".w").forEach((w) => {
        const t = parseFloat(w.dataset.t);
        tl.fromTo(w, { opacity: 0.0, y: 24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.14, ease: "back.out(2)" }, Math.max(start, t - 0.04));
      });
      if (end < 6.75) {
        tl.to(g, { opacity: 0, duration: 0.08, ease: "power2.in" }, end - 0.08);
        tl.set(g, { opacity: 0, visibility: "hidden" }, end);
      }
    });
    window.__timelines["captions"] = tl;
  </script>
</template>
