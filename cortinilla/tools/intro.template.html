<template>
  <style>
    @font-face {
      font-family: "Hind Siliguri";
      font-weight: 500;
      src: url("assets/fonts/hind-siliguri-latin-500-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "Hind Siliguri";
      font-weight: 600;
      src: url("assets/fonts/hind-siliguri-latin-600-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: "Hind Siliguri";
      font-weight: 700;
      src: url("assets/fonts/hind-siliguri-latin-700-normal.woff2") format("woff2");
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--color-ground, #ffffff);
      font-family: "Hind Siliguri", sans-serif;
      color: var(--color-accent, #e4007c);
    }
    /* resplandor rosa muy tenue detrás del mapa */
    #glow {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      background: radial-gradient(ellipse 62% 40% at 50% 46%, rgba(228, 0, 124, 0.13), rgba(228, 0, 124, 0) 70%);
    }
    #stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      perspective: 1700px;
      perspective-origin: 50% 42%;
    }
    #tilt {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      transform-origin: 50% 46%;
    }
    #map {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      overflow: visible;
    }
    .alc {
      fill: #e4007c;
      stroke: #e4007c;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    #mh-line {
      fill: none;
      stroke: #e4007c;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .ring {
      fill: none;
      stroke: #e4007c;
    }

    /* textos */
    .kick {
      position: absolute;
      left: 0;
      width: 1080px;
      text-align: center;
      font-weight: 600;
      font-size: 30px;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-transform: uppercase;
    }
    #k-city {
      top: 196px;
    }

    /* morph y logotipo */
    #morph-svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      overflow: visible;
    }
    #logo {
      position: absolute;
      left: {{LOGO_LEFT}}px;
      top: {{LOGO_TOP}}px;
      width: {{LOGO_W}}px;
      height: {{LOGO_H}}px;
    }
    #logo svg {
      position: absolute;
      left: 0;
      top: 0;
      width: {{LOGO_W}}px;
      height: {{LOGO_H}}px;
      overflow: visible;
    }
    #logo path {
      fill: #e4007c;
      fill-rule: evenodd;
    }
  </style>

  <div id="root" data-composition-id="intro" data-width="1080" data-height="1920">
    <div id="glow"></div>

    <!-- Mapa de la CDMX: 16 alcaldías (INEGI 2023), trazo rosa. La cámara se acerca cambiando el viewBox
         para que el vector se redibuje nítido en cada fotograma a 4K. -->
    <div id="stage">
      <div id="tilt">
        <svg id="map" viewBox="{{VB0}}" preserveAspectRatio="xMidYMid slice" data-layout-ignore>
          <defs>
            <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
              <circle cx="11" cy="11" r="1.25" fill="#e4007c" />
            </pattern>
            <radialGradient id="dot-fade" cx="{{MCX}}" cy="{{MCY}}" r="760" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#fff" stop-opacity="1" />
              <stop offset="0.55" stop-color="#fff" stop-opacity="0.55" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </radialGradient>
            <mask id="dot-mask" maskUnits="userSpaceOnUse" x="-900" y="-900" width="2700" height="3000">
              <rect x="-900" y="-900" width="2700" height="3000" fill="url(#dot-fade)" />
            </mask>
            <clipPath id="flood-clip">
              <circle id="flood-c" cx="{{FLOOD_X}}" cy="{{FLOOD_Y}}" r="0" />
            </clipPath>
          </defs>
          <g id="grid" mask="url(#dot-mask)" opacity="0">
            <rect x="-900" y="-900" width="2700" height="3000" fill="url(#dots)" opacity="0.32" />
          </g>
          <g id="hud" opacity="0">
            <circle id="rg1" class="ring" cx="{{MCX}}" cy="{{MCY}}" r="150" stroke-dasharray="3 7" />
            <circle id="rg2" class="ring" cx="{{MCX}}" cy="{{MCY}}" r="290" stroke-dasharray="3 9" />
            <circle id="rg3" class="ring" cx="{{MCX}}" cy="{{MCY}}" r="470" stroke-dasharray="2 12" />
          </g>
          <g id="alcs">
{{ALC_PATHS}}
          </g>
          <path id="mh-flood" d="{{MH_D}}" fill="#e4007c" clip-path="url(#flood-clip)" />
          <path id="mh-line" d="{{MH_D}}" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" />
          <circle id="rip1" class="ring" cx="{{MCX}}" cy="{{MCY}}" r="0" opacity="0" />
          <circle id="rip2" class="ring" cx="{{MCX}}" cy="{{MCY}}" r="0" opacity="0" />
        </svg>
      </div>
    </div>

    <div id="k-city" class="kick" data-layout-allow-overflow>Ciudad de México</div>

    <!-- La silueta de Miguel Hidalgo se transforma en la placa itálica del logotipo -->
    <svg id="morph-svg" viewBox="0 0 1080 1920" data-layout-ignore>
      <path id="morph" d="M0 0Z" fill="#e4007c" opacity="0" />
    </svg>

    <!-- Logotipo oficial SOMOS: rosa cívico #E4007C sobre blanco (manual de identidad 2026) -->
    <div id="logo" role="img" aria-label="SOMOS">
{{LOGO_LETTERS}}
    </div>
  </div>

  <script>
    (function () {
      const W = 1080,
        H = 1920;
      const MH = { x: {{MCX}}, y: {{MCY}} }; // centro de Miguel Hidalgo en coordenadas del mapa
      const K = {{ZOOM}}; // escala final de la cámara sobre la alcaldía
      const VB0 = { x: {{VB0X}}, y: {{VB0Y}} }; // origen del viewBox inicial (escala 1)
      const P0 = { x: MH.x - VB0.x, y: MH.y - VB0.y }; // dónde cae Miguel Hidalgo en pantalla al inicio
      const P1 = { x: W / 2, y: H / 2 };
      const MORPH_FROM = {{MORPH_FROM}};
      const MORPH_TO = {{MORPH_TO}};
      const LOGO = { left: {{LOGO_LEFT}}, top: {{LOGO_TOP}}, w: {{LOGO_W}}, h: {{LOGO_H}} };
      const LETTER_X = {{LETTER_X}};
      const SLANT = Math.tan((12.5 * Math.PI) / 180);

      const mapEl = document.getElementById("map");
      const strokeEls = Array.from(document.querySelectorAll("#alcs .alc, #mh-line"));
      const hairEls = Array.from(document.querySelectorAll("#hud .ring, #rip1, #rip2"));
      const morphEl = document.getElementById("morph");
      const morphSvg = document.getElementById("morph-svg");

      // ---- cámara: zoom logarítmico hacia Miguel Hidalgo vía viewBox
      const cam = { z: 0 };
      function applyCam() {
        const s = Math.pow(K, cam.z);
        const px = P0.x + (P1.x - P0.x) * cam.z;
        const py = P0.y + (P1.y - P0.y) * cam.z;
        const vx = MH.x - px / s,
          vy = MH.y - py / s;
        mapEl.setAttribute("viewBox", vx.toFixed(3) + " " + vy.toFixed(3) + " " + (W / s).toFixed(3) + " " + (H / s).toFixed(3));
        const sw = 2.4 / s;
        for (const el of strokeEls) el.setAttribute("stroke-width", (el.id === "mh-line" ? 4.2 / Math.pow(s, 0.55) : sw).toFixed(3));
        for (const el of hairEls) el.setAttribute("stroke-width", (1.6 / s).toFixed(3));
      }

      // ---- morph: silueta -> placa (interpolación punto a punto, centrada en pantalla)
      const mo = { p: 0, s: K };
      function applyMorph() {
        const n = MORPH_FROM.length / 2;
        const e = mo.p;
        let d = "";
        for (let i = 0; i < n; i++) {
          const ax = MORPH_FROM[2 * i] * mo.s,
            ay = MORPH_FROM[2 * i + 1] * mo.s;
          const bx = MORPH_TO[2 * i],
            by = MORPH_TO[2 * i + 1];
          const x = P1.x + ax + (bx - ax) * e,
            y = P1.y + ay + (by - ay) * e;
          d += (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
        }
        morphEl.setAttribute("d", d + "Z");
      }

      // ---- corte de la placa: un filo inclinado como los fustes del logotipo recorre la placa
      const X0 = LOGO.left - 40,
        X1 = LOGO.left + LOGO.w + 60;
      const cut = { p: 0 };
      function applyCut() {
        if (cut.p <= 0) {
          morphSvg.style.clipPath = "none";
          return;
        }
        const x = X0 + (X1 - X0) * cut.p;
        const midY = LOGO.top + LOGO.h / 2;
        const top = x + SLANT * midY,
          bot = x - SLANT * (H - midY);
        morphSvg.style.clipPath = "polygon(" + top.toFixed(1) + "px 0px, 1200px 0px, 1200px 1920px, " + bot.toFixed(1) + "px 1920px)";
      }

      applyCam();
      applyMorph();
      applyCut();

      const tl = gsap.timeline({ paused: true });

      // 0.00 · entra el plano del mapa inclinado, como una toma aérea que se asienta
      tl.fromTo("#tilt", { rotationX: 42, rotationZ: -8, scale: 0.92, y: 50 }, { rotationX: 0, rotationZ: 0, scale: 1, y: 0, duration: 1.55, ease: "power3.out", force3D: false }, 0);
      tl.fromTo("#glow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" }, 0);
      tl.to("#grid", { opacity: 1, duration: 0.6, ease: "power1.out" }, 0.05);

      // 0.00–0.95 · se dibujan los límites de las 16 alcaldías, desde Miguel Hidalgo hacia afuera
      tl.to("#mh-line", { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, 0.0);
{{ALC_TWEENS}}
      tl.to("#alcs .alc", { fillOpacity: 0.07, duration: 0.5, ease: "power1.out" }, 0.35);

      // 0.45 · Miguel Hidalgo se inunda de rosa
      tl.to("#flood-c", { attr: { r: 330 }, duration: 0.5, ease: "power3.inOut" }, 0.42);

      // HUD cartográfico: anillos de radar
      tl.to("#hud", { opacity: 0.55, duration: 0.3, ease: "power1.out" }, 0.4);
      tl.fromTo(["#rg1", "#rg2", "#rg3"], { attr: { "stroke-dashoffset": 40 }, opacity: 0 }, { attr: { "stroke-dashoffset": 0 }, opacity: 1, duration: 0.6, ease: "power2.out", stagger: 0.08 }, 0.5);
      tl.to("#rg2", { rotation: 40, svgOrigin: MH.x + " " + MH.y, duration: 1.5, ease: "none" }, 0.5);

      // ondas desde el centro de la alcaldía
      tl.fromTo("#rip1", { attr: { r: 10 }, opacity: 0.9 }, { attr: { r: 300 }, opacity: 0, duration: 0.9, ease: "power2.out" }, 0.82);
      tl.fromTo("#rip2", { attr: { r: 10 }, opacity: 0.7 }, { attr: { r: 300 }, opacity: 0, duration: 0.9, ease: "power2.out" }, 1.0);

      // texto: "Ciudad de México" arriba
      tl.fromTo("#k-city", { opacity: 0, scale: 1.12, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0.15);

      // 1.30 · sale el texto con desenfoque
      tl.to("#k-city", { opacity: 0, filter: "blur(10px)", y: -18, duration: 0.2, ease: "power2.in" }, 1.32);

      // 1.25–2.05 · la cámara se clava en Miguel Hidalgo; el resto de la ciudad se disuelve
      tl.to(cam, { z: 1, duration: 0.78, ease: "power3.inOut", onUpdate: applyCam }, 1.25);
      tl.to(["#alcs", "#hud", "#grid"], { opacity: 0, duration: 0.45, ease: "power2.in" }, 1.45);
      tl.to("#glow", { opacity: 0, duration: 0.5, ease: "power1.in" }, 1.5);

      // 2.05 · relevo invisible a la capa del morph (misma silueta, misma posición)
      tl.set("#morph", { opacity: 1 }, 2.03);
      tl.set(["#mh-flood", "#mh-line"], { opacity: 0 }, 2.03);

      // 2.05–2.50 · la alcaldía se comprime en la placa itálica del logotipo
      tl.to(mo, { p: 1, duration: 0.45, ease: "power2.inOut", onUpdate: applyMorph }, 2.03);
      tl.fromTo("#morph-svg", { scaleX: 1, scaleY: 1 }, { scaleX: 1.035, scaleY: 0.97, duration: 0.08, ease: "power2.out", transformOrigin: "540px 960px", yoyo: true, repeat: 1 }, 2.48);

      // 2.52–2.92 · el filo corta la placa y deja las letras de SOMOS
      tl.to(cut, { p: 1, duration: 0.42, ease: "power2.inOut", onUpdate: applyCut }, 2.52);
      LETTER_X.forEach(function (x0, i) {
        const t = 2.52 + 0.42 * ((x0 + 40) / (LOGO.w + 100)) - 0.04;
        tl.fromTo("#lt" + i, { opacity: 0, x: -22, filter: "blur(7px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, t);
      });
      // 2.95–4.00 · el logotipo queda quieto, rosa sobre blanco

      window.__timelines = window.__timelines || {};
      window.__timelines["intro"] = tl;
    })();
  </script>
</template>
