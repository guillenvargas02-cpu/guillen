<!doctype html>
<html
  lang="es"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Fondo","default":"#FFFFFF"},
    {"id":"color-accent","type":"color","label":"Rosa cívico","default":"#E4007C"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Cortinilla de entrada SOMOS · Miguel Hidalgo. 4 s, vertical; render 2160x3840 a 60 fps. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-fps="60" data-motion-blur="on" data-width="1080" data-height="1920">
      <div id="intro" class="clip" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Sonido (Pixabay, ver assets/sfx/CREDITS.md): el whoosh cresta en el clavado de la cámara (1.70 s)
           y el golpe grave cae cuando la alcaldía se vuelve la placa del logotipo (2.50 s). -->
      <audio id="sfx-whoosh" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="0.05" data-media-start="0.85" data-duration="3.95" data-track-index="5" data-volume="0.55" data-fade-in="0.4" data-fade-out="0.6"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="2.445" data-duration="1.555" data-track-index="6" data-volume="0.5" data-fade-out="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
