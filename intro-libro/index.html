<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Intro de 4 s — "Favor de leer antes de opinar".
         Libro 3D: la portada se presenta, se abre, las hojas pasan en ráfaga y el libro se cierra de golpe
         sobre la portada. Composición 1080x1920, se renderiza en portrait-4k (2160x3840).
         Página: 600 x 890 px (proporción real de la portada). */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050506;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050506;
      }
      .full {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
      }

      /* ---------- Fondo ---------- */
      #bg {
        background: radial-gradient(ellipse 120% 70% at 50% 45%, #15161a 0%, #0a0a0c 55%, #040405 100%);
      }
      .glow {
        position: absolute;
        border-radius: 50%;
      }
      #glow-g {
        left: -520px;
        top: 80px;
        width: 1300px;
        height: 1300px;
        background: radial-gradient(circle, rgba(0, 120, 70, 0.55) 0%, rgba(0, 104, 71, 0.18) 40%, rgba(0, 104, 71, 0) 68%);
      }
      #glow-r {
        left: 300px;
        top: 820px;
        width: 1350px;
        height: 1350px;
        background: radial-gradient(circle, rgba(214, 20, 40, 0.5) 0%, rgba(206, 17, 38, 0.16) 40%, rgba(206, 17, 38, 0) 68%);
      }
      #halo {
        left: 40px;
        top: 360px;
        width: 1000px;
        height: 1200px;
        background: radial-gradient(ellipse at center, rgba(255, 236, 205, 0.32) 0%, rgba(255, 220, 170, 0.1) 38%, rgba(255, 220, 170, 0) 66%);
      }
      .beam {
        position: absolute;
        top: -300px;
        width: 260px;
        height: 2600px;
        transform-origin: 50% 0%;
        background: linear-gradient(180deg, rgba(255, 240, 215, 0.2) 0%, rgba(255, 240, 215, 0.06) 45%, rgba(255, 240, 215, 0) 80%);
        filter: blur(26px);
      }
      .dust {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 238, 210, 0.9);
      }

      /* ---------- Libro 3D ---------- */
      #cam {
        perspective: 2300px;
        perspective-origin: 540px 900px;
      }
      #book {
        position: absolute;
        left: 540px;
        top: 515px;
        width: 0;
        height: 890px;
        transform-style: preserve-3d;
      }
      .plane {
        position: absolute;
        top: 0;
        height: 890px;
        transform-style: preserve-3d;
      }
      .leaf {
        left: 0;
        width: 600px;
        transform-origin: 0 50%;
      }
      .seg {
        position: absolute;
        top: 0;
        width: 300px;
        height: 890px;
        transform-style: preserve-3d;
        transform-origin: 0 50%;
      }
      .seg.a {
        left: 0;
      }
      .seg.b {
        left: 300px;
      }
      .face {
        position: absolute;
        left: 0;
        top: 0;
        width: 300px;
        height: 890px;
        background-size: 600px 890px;
        background-repeat: no-repeat;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        overflow: hidden;
      }
      .face.back {
        transform: rotateY(180deg);
      }
      .seg.a .face {
        width: 301px; /* 1 px de traslape: sin costura entre las dos mitades de la hoja */
      }
      .seg.a .face.front {
        background-position: 0 0;
      }
      .seg.b .face.front {
        background-position: -300px 0;
      }
      .seg.a .face.back {
        background-position: -300px 0;
      }
      .seg.b .face.back {
        background-position: 0 0;
      }
      .sh {
        position: absolute;
        left: 0;
        top: 0;
        width: 300px;
        height: 890px;
        background: #1b120a;
        opacity: 0;
      }
      /* bloque de páginas bajo las hojas + cantos */
      #stack {
        left: 0;
        width: 600px;
        background-size: 600px 890px;
      }
      #backboard {
        left: -4px;
        top: -5px;
        width: 610px;
        height: 900px;
        background: #5e0c12;
        transform: translateZ(-20px);
        border-radius: 3px;
      }
      .edge {
        position: absolute;
        background: repeating-linear-gradient(90deg, #efe6d2 0px, #efe6d2 1.4px, #c9bc9f 1.8px, #efe6d2 2.4px);
      }
      #edge-r {
        left: 600px;
        top: 0;
        width: 19px;
        height: 890px;
        transform-origin: 0 50%;
        transform: rotateY(90deg);
      }
      #edge-b {
        left: 0;
        top: 890px;
        width: 600px;
        height: 19px;
        transform-origin: 50% 0;
        transform: rotateX(-90deg);
        background: repeating-linear-gradient(0deg, #efe6d2 0px, #efe6d2 1.4px, #c9bc9f 1.8px, #efe6d2 2.4px);
      }
      #edge-t {
        left: 0;
        top: -19px;
        width: 600px;
        height: 19px;
        transform-origin: 50% 100%;
        transform: rotateX(90deg);
        background: repeating-linear-gradient(0deg, #efe6d2 0px, #efe6d2 1.4px, #c9bc9f 1.8px, #efe6d2 2.4px);
      }
      /* brillo que barre la portada */
      #gloss {
        left: 0;
        width: 600px;
        overflow: hidden;
      }
      #gloss-band {
        position: absolute;
        left: -500px;
        top: -200px;
        width: 260px;
        height: 1300px;
        transform: rotate(18deg);
        background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.08) 30%, rgba(255, 255, 255, 0.42) 50%, rgba(255, 255, 255, 0.08) 70%, rgba(255, 255, 255, 0) 100%);
      }

      /* ---------- Efectos encima ---------- */
      .spark {
        position: absolute;
        border-radius: 50%;
      }
      #leak {
        position: absolute;
        left: -700px;
        top: 260px;
        width: 1300px;
        height: 1300px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 176, 92, 0.42) 0%, rgba(255, 120, 60, 0.16) 38%, rgba(255, 120, 60, 0) 68%);
        opacity: 0;
      }
      #streak {
        position: absolute;
        left: -260px;
        top: 950px;
        width: 1600px;
        height: 20px;
        background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255, 255, 255, 1) 0%, rgba(255, 228, 190, 0.7) 22%, rgba(255, 200, 150, 0) 70%);
        opacity: 0;
      }
      #streak-soft {
        position: absolute;
        left: -460px;
        top: 860px;
        width: 2000px;
        height: 200px;
        background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255, 220, 180, 0.45) 0%, rgba(255, 180, 120, 0) 70%);
        opacity: 0;
      }
      #flash {
        background: radial-gradient(ellipse 80% 60% at 50% 50%, #fff7ea 0%, #ffe2c0 45%, #f0b080 100%);
        opacity: 0;
      }
      #vignette {
        background: radial-gradient(ellipse 85% 62% at 50% 48%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.55) 82%, rgba(0, 0, 0, 0.85) 100%);
      }
      #grain {
        position: absolute;
        left: -512px;
        top: -512px;
        width: 2104px;
        height: 2944px;
        background: url("assets/grain.png") repeat;
        opacity: 0.075;
      }
      #fade {
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <audio id="sfx" class="clip" src="assets/sfx.wav" data-start="0" data-duration="4" data-track-index="9" data-volume="1"></audio>

      <div id="bg" class="full">
        <div id="glow-g" class="glow"></div>
        <div id="glow-r" class="glow"></div>
        <div id="beam1" class="beam" style="left: 250px"></div>
        <div id="beam2" class="beam" style="left: 520px; width: 200px"></div>
        <div id="beam3" class="beam" style="left: 760px; width: 300px"></div>
        <div id="halo" class="glow"></div>
        <div id="dust" class="full"></div>
      </div>

      <div id="cam" class="full">
        <div id="book" data-layout-allow-overflow>
          <div id="backboard" class="plane"></div>
          <div id="stack" class="plane" style="background-image: url('assets/pages/stack.jpg')">
            <div id="edge-r" class="edge"></div>
            <div id="edge-b" class="edge"></div>
            <div id="edge-t" class="edge"></div>
          </div>
          <!-- hojas: se generan por script (tapa + 12 hojas) -->
          <div id="gloss" class="plane" style="background: url('assets/portada-hd.jpg') 0 0 / 600px 890px no-repeat"><div id="gloss-band"></div></div>
        </div>
      </div>

      <div id="fxfront" class="full">
        <div id="leak"></div>
        <div id="sparks" class="full"></div>
        <div id="streak-soft" data-layout-allow-overflow></div>
        <div id="streak" data-layout-allow-overflow></div>
      </div>
      <div id="flash" class="full"></div>
      <div id="vignette" class="full"></div>
      <div id="grainbox" class="full" style="overflow: hidden"><div id="grain"></div></div>
      <div id="fade" class="full"></div>
    </div>

    <script>
      (function () {
        const W = 600;
        const N = 12; // hojas de papel (además de la tapa)
        const book = document.getElementById("book");
        const gloss = document.getElementById("gloss");

        // PRNG determinista (sin Math.random)
        let seed = 20261112;
        const rnd = () => {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };

        // ---------- construir hojas ----------
        const pad = (n) => String(n).padStart(2, "0");
        const leaves = [];
        for (let i = 0; i <= N; i++) {
          const front = i === 0 ? "assets/portada-hd.jpg" : `assets/pages/r${pad(i - 1)}.jpg`;
          const back = i === 0 ? "assets/endpaper.jpg" : `assets/pages/v${pad(i - 1)}.jpg`;
          const leaf = document.createElement("div");
          leaf.className = "plane leaf";
          leaf.id = `leaf${i}`;
          for (const s of ["a", "b"]) {
            const seg = document.createElement("div");
            seg.className = `seg ${s}`;
            seg.id = `leaf${i}${s}`;
            seg.innerHTML =
              `<div class="face front" style="background-image:url('${front}')"><div class="sh shf"></div></div>` +
              `<div class="face back" style="background-image:url('${back}')"><div class="sh shb"></div></div>`;
            leaf.appendChild(seg);
          }
          book.insertBefore(leaf, gloss);
          leaves.push(leaf);
        }

        // ---------- polvo en suspensión ----------
        const dustBox = document.getElementById("dust");
        const dust = [];
        for (let i = 0; i < 46; i++) {
          const d = document.createElement("div");
          d.className = "dust";
          const s = 2 + rnd() * 5;
          const blur = rnd() < 0.35 ? 3 + rnd() * 4 : rnd() * 1.2;
          d.style.cssText = `left:${rnd() * 1080}px;top:${rnd() * 1920}px;width:${s}px;height:${s}px;filter:blur(${blur.toFixed(1)}px);opacity:${(0.25 + rnd() * 0.6).toFixed(2)}`;
          dustBox.appendChild(d);
          dust.push({ el: d, dx: (rnd() - 0.5) * 70, dy: -40 - rnd() * 110 });
        }

        // ---------- chispas del impacto ----------
        const sparkBox = document.getElementById("sparks");
        const sparks = [];
        const sCol = ["#fff4dc", "#ffd59a", "#1fae5c", "#ff3b45", "#ffffff"];
        for (let i = 0; i < 34; i++) {
          const el = document.createElement("div");
          el.className = "spark";
          const s = 3 + rnd() * 6;
          const c = sCol[Math.floor(rnd() * sCol.length)];
          // nacen en el borde de la portada (840 x 1246 centrada)
          const side = Math.floor(rnd() * 4);
          let x0, y0;
          if (side === 0) { x0 = 120 + rnd() * 840; y0 = 337; }
          else if (side === 1) { x0 = 120 + rnd() * 840; y0 = 1583; }
          else if (side === 2) { x0 = 120; y0 = 337 + rnd() * 1246; }
          else { x0 = 960; y0 = 337 + rnd() * 1246; }
          const ang = Math.atan2(y0 - 960, x0 - 540) + (rnd() - 0.5) * 0.8;
          const dist = 180 + rnd() * 420;
          el.style.cssText = `left:${x0}px;top:${y0}px;width:${s}px;height:${s}px;background:${c};box-shadow:0 0 ${(s * 3).toFixed(0)}px ${c};opacity:0`;
          sparkBox.appendChild(el);
          sparks.push({ el, dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist + 60, d: 0.7 + rnd() * 0.7 });
        }

        // ---------- línea de tiempo ----------
        const tl = gsap.timeline({ paused: true });
        const T_OPEN = 0.58;
        const T_CLOSE = 2.1;
        const IMPACT = 2.62;
        const zR = (i) => (N - i) * 0.9 + 1; // apiladas a la derecha (la tapa arriba)
        const zL = (i) => i * 0.9 + 1; // apiladas a la izquierda (la tapa abajo)

        gsap.set("#book", { transformOrigin: "0px 445px" });
        leaves.forEach((lf, i) => gsap.set(lf, { rotationY: 0, z: zR(i) }));
        gsap.set("#gloss", { z: zR(0) + 0.6, opacity: 1 });
        gsap.set(".seg.b", { rotationY: 0 });
        gsap.set(".sh", { opacity: 0 });

        // Ida: una hoja pasa de derecha a izquierda, con curvatura y sombra
        function flip(i, t, d, dir) {
          const lf = leaves[i];
          const to = dir > 0 ? -180 : 0;
          const from = dir > 0 ? 0 : -180;
          tl.fromTo(lf, { rotationY: from, z: dir > 0 ? zR(i) : zL(i) }, { rotationY: to, z: dir > 0 ? zL(i) : zR(i), duration: d, ease: dir > 0 ? "sine.inOut" : "power2.in", immediateRender: false }, t);
          const b = `#leaf${i}b`;
          const bend = dir > 0 ? 34 : -30;
          tl.fromTo(b, { rotationY: 0 }, { rotationY: bend, duration: d * 0.45, ease: "sine.out", immediateRender: false }, t);
          tl.to(b, { rotationY: -bend * 0.18, duration: d * 0.4, ease: "sine.inOut" }, t + d * 0.45);
          tl.to(b, { rotationY: 0, duration: d * 0.15, ease: "sine.out" }, t + d * 0.85);
          const fr = `#leaf${i} .shf`;
          const bk = `#leaf${i} .shb`;
          if (dir > 0) {
            tl.fromTo(fr, { opacity: 0 }, { opacity: 0.55, duration: d * 0.5, ease: "power1.in", immediateRender: false }, t);
            tl.fromTo(bk, { opacity: 0.55 }, { opacity: 0, duration: d * 0.5, ease: "power1.out", immediateRender: false }, t + d * 0.5);
          } else {
            tl.fromTo(bk, { opacity: 0 }, { opacity: 0.55, duration: d * 0.5, ease: "power1.in", immediateRender: false }, t);
            tl.fromTo(fr, { opacity: 0.55 }, { opacity: 0, duration: d * 0.5, ease: "power1.out", immediateRender: false }, t + d * 0.5);
          }
        }

        // 1) Presentación: libro cerrado, de tres cuartos, acercándose
        const closedX = (s) => -300 * s;
        tl.fromTo("#book", { x: closedX(1.0), y: 90, scale: 1.0, rotationY: -26, rotationX: 16, rotationZ: -6 }, { x: closedX(1.12), y: 25, scale: 1.12, rotationY: -9, rotationX: 9, rotationZ: -2, duration: T_OPEN - 0.02, ease: "power2.out" }, 0);
        tl.fromTo("#gloss-band", { x: 0 }, { x: 1300, duration: 0.75, ease: "power2.inOut" }, 0.05);
        tl.set("#gloss", { opacity: 0 }, T_OPEN + 0.02);

        // 2) Se abre: el libro se centra sobre el lomo y se inclina como sobre una mesa
        tl.to("#book", { x: 0, y: 40, scale: 0.79, rotationY: -3, rotationX: 20, rotationZ: 0, duration: 0.62, ease: "power3.inOut" }, T_OPEN - 0.02);
        tl.to("#book", { y: 20, scale: 0.82, rotationY: 4, rotationX: 17, duration: T_CLOSE - (T_OPEN + 0.6), ease: "sine.inOut" }, T_OPEN + 0.6);
        flip(0, T_OPEN, 0.44, 1);

        // 3) Ráfaga: las hojas aceleran y luego frenan
        const gaps = [0.12, 0.1, 0.085, 0.07, 0.06, 0.055, 0.052, 0.055, 0.062, 0.075, 0.09];
        const flips = [];
        let t = T_OPEN + 0.27;
        for (let i = 1; i <= N; i++) {
          const d = i <= 2 ? 0.34 : i >= N - 1 ? 0.3 : 0.25;
          flip(i, t, d, 1);
          flips.push(+(t + d * 0.8).toFixed(3));
          t += gaps[i - 1] || 0;
        }

        // 4) Cierre de golpe: las hojas regresan en cascada y la tapa cae
        for (let i = N; i >= 1; i--) flip(i, T_CLOSE + (N - i) * 0.017, 0.27, -1);
        flip(0, IMPACT - 0.25, 0.25, -1);
        tl.to("#book", { x: closedX(1.3), y: 0, scale: 1.3, rotationY: 0, rotationX: 4, rotationZ: 0, duration: IMPACT - T_CLOSE, ease: "power3.in" }, T_CLOSE);
        tl.set("#gloss", { opacity: 1 }, IMPACT);

        // 5) Impacto: pop, sacudida, destello, línea anamórfica y chispas
        tl.to("#book", { x: closedX(1.345), scale: 1.345, rotationX: 0, duration: 0.07, ease: "power2.out" }, IMPACT);
        tl.to("#book", { x: closedX(1.32), scale: 1.32, duration: 0.25, ease: "power2.out" }, IMPACT + 0.07);
        tl.to("#book", { x: closedX(1.4), scale: 1.4, rotationY: -2.5, rotationX: -2, duration: 4 - (IMPACT + 0.32), ease: "sine.inOut" }, IMPACT + 0.32);
        const shake = [[16, -11], [-13, 9], [9, -7], [-6, 5], [4, -3], [-2, 1], [0, 0]];
        shake.forEach(([x, y], k) => tl.to("#cam", { x, y, duration: 0.032, ease: "none" }, IMPACT + k * 0.032));
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.75, duration: 0.03, ease: "none" }, IMPACT - 0.01);
        tl.to("#flash", { opacity: 0, duration: 0.45, ease: "power2.out" }, IMPACT + 0.02);
        tl.fromTo("#streak", { opacity: 0, scaleX: 0.2, scaleY: 1 }, { opacity: 1, scaleX: 1.25, duration: 0.08, ease: "power2.out" }, IMPACT - 0.02);
        tl.to("#streak", { opacity: 0, scaleX: 1.6, scaleY: 0.5, duration: 0.7, ease: "power2.out" }, IMPACT + 0.06);
        tl.fromTo("#streak-soft", { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1.1, duration: 0.1, ease: "power2.out" }, IMPACT - 0.02);
        tl.to("#streak-soft", { opacity: 0, scaleX: 1.4, duration: 0.9, ease: "power2.out" }, IMPACT + 0.08);
        sparks.forEach((s) => {
          tl.fromTo(s.el, { x: 0, y: 0, opacity: 0, scale: 1 }, { opacity: 1, duration: 0.02, ease: "none" }, IMPACT);
          tl.to(s.el, { x: s.dx, y: s.dy, scale: 0.3, duration: s.d, ease: "expo.out" }, IMPACT);
          tl.to(s.el, { opacity: 0, duration: s.d * 0.6, ease: "power1.in" }, IMPACT + s.d * 0.4);
        });

        // 6) Portada heroica: segundo brillo y cierre a negro
        tl.fromTo("#gloss-band", { x: 0 }, { x: 1300, duration: 0.85, ease: "power2.inOut", immediateRender: false }, IMPACT + 0.3);
        tl.fromTo("#fade", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power1.out" }, 0);
        tl.to("#fade", { opacity: 1, duration: 0.22, ease: "power1.in" }, 3.78);

        // ---------- atmósfera ----------
        tl.fromTo("#glow-g", { scale: 0.9, opacity: 0.7 }, { scale: 1.08, opacity: 1, duration: IMPACT, ease: "sine.inOut" }, 0);
        tl.fromTo("#glow-r", { scale: 0.92, opacity: 0.7 }, { scale: 1.06, opacity: 1, duration: IMPACT, ease: "sine.inOut" }, 0);
        tl.to(["#glow-g", "#glow-r"], { scale: 1.22, duration: 0.12, ease: "power2.out" }, IMPACT);
        tl.to(["#glow-g", "#glow-r"], { scale: 1.12, opacity: 0.85, duration: 1.2, ease: "sine.out" }, IMPACT + 0.12);
        tl.fromTo("#halo", { opacity: 0.5, scale: 0.9 }, { opacity: 0.35, scale: 1, duration: IMPACT, ease: "sine.inOut" }, 0);
        tl.to("#halo", { opacity: 1, scale: 1.12, duration: 0.1, ease: "power2.out" }, IMPACT);
        tl.to("#halo", { opacity: 0.6, scale: 1.05, duration: 1.2, ease: "sine.out" }, IMPACT + 0.1);
        [["#beam1", -16, -8], ["#beam2", 4, -3], ["#beam3", 18, 10]].forEach(([id, a0, a1]) => tl.fromTo(id, { rotation: a0, opacity: 0.7 }, { rotation: a1, opacity: 1, duration: 4, ease: "none" }, 0));
        dust.forEach((p) => tl.fromTo(p.el, { x: 0, y: 0 }, { x: p.dx, y: p.dy, duration: 4, ease: "none" }, 0));
        tl.fromTo("#leak", { opacity: 0, x: 0, y: 0 }, { opacity: 1, x: 520, y: -120, duration: 0.6, ease: "sine.out" }, T_OPEN - 0.1);
        tl.to("#leak", { opacity: 0, x: 1000, y: -260, duration: 0.7, ease: "sine.in" }, T_OPEN + 0.5);

        // grano de película a 24 cambios por segundo
        for (let k = 0; k < 96; k++) tl.set("#grain", { x: -Math.floor(rnd() * 512), y: -Math.floor(rnd() * 512) }, k / 24);

        tl.set({}, {}, 4);
        window.__flipTimes = flips; // usado al diseñar el sonido
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
