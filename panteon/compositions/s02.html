        <div id="s02-rule"></div>

  <script>

    const tl = gsap.timeline({ paused: true });
    const EXP = "--hf-color-grading-exposure";
    // relámpago: subida de exposición de 1-2 cuadros con un rebote, vuelve a la base
    function rayo(sel, t, base, k = 1) {
      tl.to(sel, { [EXP]: base + 1.6 * k, duration: 0.033, ease: "none" }, t)
        .to(sel, { [EXP]: base + 0.1, duration: 0.066, ease: "none" }, t + 0.033)
        .to(sel, { [EXP]: base + 1.0 * k, duration: 0.033, ease: "none" }, t + 0.1)
        .to(sel, { [EXP]: base, duration: 0.35, ease: "power2.out" }, t + 0.133);
    }
    // sacudida de cámara determinista que se apaga en ~0.4 s
    function sacude(sel, t, amp = 10) {
      const k = [[1, -0.6], [-0.8, 0.9], [0.6, -0.4], [-0.35, 0.3], [0.15, -0.1], [0, 0]];
      k.forEach(([x, y], i) => tl.to(sel, { x: x * amp, y: y * amp, duration: 0.066, ease: "none" }, t + i * 0.066));
    }
    // entrada por palabra con desenfoque (sin desplazamiento)
    function entra(sel, t, gap = 0.08, d = 0.18, blur = 8) {
      tl.fromTo(sel, { opacity: 0, filter: `blur(${blur}px)` }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power2.out", stagger: gap }, t);
    }
    function sale(sel, t, d = 0.2) {
      tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: d, ease: "power2.in" }, t);
    }


    entra("#s02-a .w", 0.12, 0.11, 0.3, 10);
    tl.fromTo("#s02-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 0.45);
    entra("#s02-b .w", 0.6, 0.11, 0.3, 10);
    sale("#s02-t > div", 2.15, 0.22);

    window.__timelines["s02"] = tl;
  </script>
