<!doctype html>
<html
  lang="es"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Fondo","default":"#FFFFFF"},
    {"id":"color-accent","type":"color","label":"Rosa cívico","default":"#E4007C"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Cortinilla SOMOS · el logotipo estalla en esquirlas 3D y se vuelve a armar. 4 s, vertical; render 2160x3840 a 60 fps. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-fps="60" data-motion-blur="on" data-motion-blur-events="on" data-width="1080" data-height="1920">
      <div id="shatter" class="clip" data-composition-id="shatter" data-composition-src="compositions/shatter.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Sonido (Pixabay, ver assets/sfx/CREDITS.md): whoosh del estallido (0.05 s), riser que crece durante el tiempo
           congelado y el rebobinado hasta el encaje (2.20 s), y golpe grave cuando encaja la última pieza. -->
      <audio id="sfx-burst" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0" data-media-start="0.11" data-duration="0.46" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="0" data-media-start="1.27" data-duration="2.6" data-track-index="5" data-volume="0.4" data-fade-in="0.6" data-fade-out="0.35"></audio>
      <audio id="sfx-slam" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="2.13" data-duration="1.87" data-track-index="6" data-volume="0.55" data-fade-out="0.6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
