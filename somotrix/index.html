<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Capa gráfica de SOMOTRIX. El footage y el audio los arma build.py con ffmpeg
         (cortes en la rejilla de beats, 4K, gradación) y luego compone esta capa encima.
         Paleta: rosa SOMOS (#e60872), rosa encendido, ciruela y blanco. */
      :root {
        --pink: #e60872;
        --hot: #ff3d9a;
        --plum: #1a0410;
        --ink: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "JetBrains Mono", monospace;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <!-- Cortinilla SOMOS → mensaje del robot → bailes al beat (124.1 BPM, golpe en 14.26) → corte seco en 25.864 → logo -->
      <div id="opener" class="clip" data-composition-id="opener" data-composition-src="compositions/opener.html" data-start="0" data-duration="2.31" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="title" class="clip" data-composition-id="title" data-composition-src="compositions/title.html" data-start="2.31" data-duration="1.44" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="voz" class="clip" data-composition-id="voz" data-composition-src="compositions/voz.html" data-start="3.75" data-duration="10.51" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="3.75" data-duration="10.51" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="social" class="clip" data-composition-id="social" data-composition-src="compositions/social.html" data-start="7.84" data-duration="5.46" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="dance" class="clip" data-composition-id="dance" data-composition-src="compositions/dance.html" data-start="14.26" data-duration="11.604" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="outro" class="clip" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="25.864" data-duration="4.136" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="flashes" class="clip" data-composition-id="flashes" data-composition-src="compositions/flashes.html" data-start="0" data-duration="30" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 20"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
