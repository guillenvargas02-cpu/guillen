    const NB = 34;
    const barsBox = document.querySelector("#vz-bars");
    const bars = [];
    for (let i = 0; i < NB; i++) {
      const el = document.createElement("div");
      el.className = "vz-bar";
      el.style.left = i * (860 / NB) + 5 + "px";
      barsBox.appendChild(el);
      bars.push(el);
    }
    const barLevel = (frame, i) => {
      const row = BANDS[Math.max(0, Math.min(BANDS.length - 1, frame))];
      const c = Math.abs(i - (NB - 1) / 2) / ((NB - 1) / 2);
      const x = c * 7, k = Math.floor(x), f = x - k;
      const v = row[k] * (1 - f) + row[Math.min(7, k + 1)] * f;
      return 0.06 + 0.94 * v * (1 - 0.3 * c);
    };

    const NR = 5, PERIOD = 0.22, LIFE = 1.0;
    const ringsBox = document.querySelector("#vz-rings");
    const rings = [];
    for (let i = 0; i < NR; i++) {
      const r = document.createElement("div");
      r.className = "vz-ring";
      ringsBox.appendChild(r);
      rings.push(r);
    }
    const glow = document.querySelector("#vz-glow");
    // polvo de píxeles rosas que sube (posiciones fijas por semilla)
    let seed = 5;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const px = [];
    const pxBox = document.querySelector("#vz-pixels");
    for (let i = 0; i < 26; i++) {
      const e = document.createElement("div");
      e.className = "vz-px";
      pxBox.appendChild(e);
      px.push({ e, x: 80 + rnd() * 920, y: 300 + rnd() * 1250, sp: 30 + rnd() * 70, s: 0.4 + rnd() * 0.9, ph: rnd() * 6.28 });
    }

    const p = { t: 0 };
    tl.to(
      p,
      {
        t: D,
        duration: D,
        ease: "none",
        onUpdate: () => {
          const t = p.t;
          const fr = Math.floor(t * 30);
          for (let i = 0; i < NB; i++) bars[i].style.transform = "scaleY(" + barLevel(fr, i).toFixed(3) + ")";
          const [cx, cy, z] = chestAt(T0 + t);
          const e = envAt(t);
          glow.style.transform = `translate(${cx.toFixed(1)}px, ${cy.toFixed(1)}px) scale(${(0.55 + 0.75 * e) * z * 0.8})`;
          glow.style.opacity = (0.35 + 0.65 * e).toFixed(3);
          const base = Math.floor(t / PERIOD);
          for (let i = 0; i < NR; i++) {
            const birth = (base - i) * PERIOD;
            const age = t - birth;
            const a = birth >= 0 ? envAt(birth) : 0;
            const k = age / LIFE;
            const r = rings[i];
            if (k < 0 || k > 1 || a < 0.18) {
              r.style.opacity = "0";
              continue;
            }
            const sc = (0.25 + 2.6 * Math.pow(k, 0.7)) * z;
            r.style.transform = `translate(${cx.toFixed(1)}px, ${cy.toFixed(1)}px) scale(${sc.toFixed(3)})`;
            r.style.opacity = (a * (1 - k) * 0.95).toFixed(3);
          }
          px.forEach((q) => {
            const y = ((q.y - t * q.sp) % 1300 + 1300) % 1300 + 260;
            q.e.style.transform = `translate(${q.x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${q.s}) rotate(45deg)`;

          });
        },
      },

    );

    }
    // destello diagonal rosa en cada cambio de encuadre
    SEGS.slice(1).forEach((s) => {
      tl.fromTo("#vz-streak", { x: 0, opacity: 1 }, { x: 2400, duration: 0.3, ease: "power2.inOut", immediateRender: false }, s[0] - T0 - 0.08);

    tl.to(["#vz-rec", "#vz-pixels", "#vz-panel", "#vz-scrim"], { opacity: 0, duration: 0.08 }, D - 0.08);
