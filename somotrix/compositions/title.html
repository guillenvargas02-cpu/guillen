<template>
  <style>
    @font-face {
      font-family: "Inter Display";
      font-weight: 800;
      font-style: italic;
      src: local("Inter Display ExtraBold Italic"), local("InterDisplay-ExtraBoldItalic");
    }
    #root {
      position: absolute;
      inset: 0;
      font-family: "Inter Display", "Inter", sans-serif;
    }
    /* Nombre del robot, una sola vez, mientras se voltea. Rosa de marca, sin subtítulos. */
    #tt-block {
      position: absolute;
      left: 0;
      top: 290px;
      width: 1080px;
      height: 240px;
    }
    .tt-word {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      text-align: center;
      font-size: 168px;
      line-height: 1;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    #tt-hot {
      color: #ff3d9a;
    }
    #tt-plum {
      color: #1a0410;
      opacity: 0.55;
    }
    #tt-main {
      color: #fff;
      text-shadow: 0 0 30px rgba(230, 8, 114, 0.55), 0 6px 22px rgba(26, 4, 16, 0.35);
    }
    #tt-bar {
      position: absolute;
      left: 250px;
      top: 196px;
      width: 580px;
      height: 16px;
      background: #e60872;
      transform: skewX(-18deg);
      box-shadow: 0 0 20px rgba(230, 8, 114, 0.7);
    }
    #tt-bar2 {
      position: absolute;
      left: 250px;
      top: 222px;
      width: 220px;
      height: 6px;
      background: #fff;
      transform: skewX(-18deg);
    }
  </style>
  <div id="root" data-composition-id="title" data-width="1080" data-height="1920">
    <div id="tt-block">
      <div id="tt-plum" class="tt-word" data-layout-ignore>SOMOTRIX</div>
      <div id="tt-hot" class="tt-word" data-layout-ignore>SOMOTRIX</div>
      <div id="tt-main" class="tt-word">SOMOTRIX</div>
      <div id="tt-bar"></div>
      <div id="tt-bar2"></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const WORD = "SOMOTRIX";
    const GLYPHS = "01<>/#▲X%";
    const main = document.querySelector("#tt-main");
    let seed = 11;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const table = Array.from({ length: 40 }, () => Array.from({ length: 8 }, () => GLYPHS[Math.floor(rnd() * GLYPHS.length)]));
    const scramble = (prog, frame) =>
      WORD.split("")
        .map((ch, i) => (prog * WORD.length > i + 0.5 ? ch : table[frame % 40][i]))
        .join("");
    const p = { t: 0 };
    tl.to(p, { t: 1, duration: 0.36, ease: "none", onUpdate: () => (main.textContent = scramble(p.t, Math.floor(p.t * 30))) }, 0);
    tl.fromTo(".tt-word", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" }, 0);
    tl.fromTo("#tt-hot", { x: 40, y: 6 }, { x: 7, y: 0, duration: 0.6, ease: "expo.out" }, 0);
    tl.fromTo("#tt-plum", { x: -34, y: -4 }, { x: -5, y: 0, duration: 0.6, ease: "expo.out" }, 0);
    tl.fromTo("#tt-bar", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 0.12);
    tl.fromTo("#tt-bar2", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 0.22);
    tl.fromTo("#tt-block", { y: 0 }, { y: -18, duration: 1.4, ease: "none" }, 0);
    [0.62, 0.95].forEach((t, k) => {
      tl.set("#tt-main", { x: k ? -12 : 12, skewX: k ? 10 : -10 }, t);
      tl.set("#tt-hot", { x: k ? 30 : -24 }, t);
      tl.set("#tt-main", { x: 0, skewX: 0 }, t + 0.06);
      tl.set("#tt-hot", { x: 7 }, t + 0.06);
    });
    // sale en seco justo antes de "Atención"
    tl.to("#tt-block", { scaleY: 0.04, opacity: 0, duration: 0.14, ease: "expo.in" }, 1.3);

    window.__timelines["title"] = tl;
  </script>
