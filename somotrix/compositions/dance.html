<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    /* Bailes: sin texto. Ráfaga de píxeles en el golpe, barras diagonales rosas en cada frase,
       marco que destella en cada corte, franjas de cine en la cámara lenta y scanlines en el stutter. */
    #dc-frame {
      position: absolute;

    }
    .dc-bar {
      position: absolute;

      transform: skewX(-18deg);

    #dc-b1 {
      left: -900px;

    }
    #dc-b2 {

    }
    #dc-b3 {
      left: -900px;

    .dc-px {
      position: absolute;
      left: 530px;

    .dc-lb {
      position: absolute;

    #dc-lb1 {

    .dc-leak {
      position: absolute;

    #dc-leak1 {
      left: -380px;

      background: radial-gradient(circle, rgba(255, 61, 154, 0.55) 0%, rgba(230, 8, 114, 0) 65%);
    }
    #dc-leak2 {
      left: 560px;
      top: 1000px;

    }
    #dc-scan {
      position: absolute;

    #dc-tint {

      opacity: 0;

  </style>
  <div id="root" data-composition-id="dance" data-width="1080" data-height="1920">
    <div id="dc-leak1" class="dc-leak"></div>
    <div id="dc-leak2" class="dc-leak"></div>
    <div id="dc-tint"></div>
    <div id="dc-scan"></div>
    <div id="dc-px"></div>
    <div id="dc-b1" class="dc-bar"></div>
    <div id="dc-b2" class="dc-bar"></div>
    <div id="dc-b3" class="dc-bar"></div>
    <div id="dc-lb1" class="dc-lb"></div>
    <div id="dc-lb2" class="dc-lb"></div>
    <div id="dc-c1" class="dc-c"></div>
    <div id="dc-c2" class="dc-c"></div>
    <div id="dc-c3" class="dc-c"></div>
    <div id="dc-c4" class="dc-c"></div>
    <div id="dc-frame"></div>
  </div>
  <script>
    gsap.set(".dc-lb", { scaleY: 0 });
    const tl = gsap.timeline({ paused: true });
    const B = 0.4835;
    const D = 24 * B;
    let seed = 31;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

    // --- ráfaga de píxeles rosas en el golpe de entrada y en cada frase ---
    const pxBox = document.querySelector("#dc-px");
    const bursts = [0, 8 * B, 16 * B];
    bursts.forEach((t0, b) => {
      for (let i = 0; i < 22; i++) {
        const e = document.createElement("div");
        e.className = "dc-px";
        pxBox.appendChild(e);
        const ang = (i / 22) * Math.PI * 2 + rnd() * 0.3;
        const dist = 380 + rnd() * 520;
        const s = 0.6 + rnd() * 1.6;
        tl.set(e, { opacity: 0 }, 0);
        tl.fromTo(
          e,
          { x: 0, y: 0, scale: s, rotation: 0, opacity: 1 },
          { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist * 1.5, rotation: 180, opacity: 0, duration: 0.7, ease: "expo.out", immediateRender: false },
          t0
        );
      }
    });

    // --- barras diagonales rosas en el golpe y en cada frase ---
    [0, 8 * B, 16 * B].forEach((t) => {
      tl.fromTo("#dc-b1", { x: 0 }, { x: 2600, duration: 0.32, ease: "power2.inOut", immediateRender: false }, t);
      tl.fromTo("#dc-b2", { x: 0 }, { x: 2600, duration: 0.28, ease: "power2.inOut", immediateRender: false }, t + 0.04);
      tl.fromTo("#dc-b3", { x: 0 }, { x: 2600, duration: 0.25, ease: "power2.inOut", immediateRender: false }, t + 0.08);
    });

    // --- marco que destella en cada corte y esquinas que laten en cada beat ---
    const cuts = [0, 2, 4, 6, 8, 12, 13, 14, 15, 16, 18, 18 + 1 / 3, 18 + 2 / 3, 19, 20, 22].map((k) => k * B);
    tl.set("#dc-frame", { opacity: 0 }, 0);
    cuts.forEach((t) => {
      tl.set("#dc-frame", { opacity: 1 }, t);
      tl.to("#dc-frame", { opacity: 0, duration: 0.22, ease: "power2.out" }, t + 0.001);
    });
    tl.fromTo(".dc-c", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 0.02);
    for (let k = 0; k < 24; k++) {
      const big = k % 4 === 0;
      tl.fromTo(".dc-c", { scale: big ? 1.25 : 1.1 }, { scale: 1, duration: B * 0.9, ease: "power2.out", immediateRender: false }, k * B);
    }

    // --- cámara lenta (beats 8-12): franjas de cine y luces rosas que flotan ---
    tl.set([".dc-lb"], { scaleY: 0 }, 0);
    tl.to(".dc-lb", { scaleY: 1, duration: 0.3, ease: "expo.out" }, 8 * B);
    tl.to(".dc-lb", { scaleY: 0, duration: 0.15, ease: "expo.in" }, 12 * B - 0.12);
    tl.to(".dc-c", { opacity: 0, duration: 0.1 }, 8 * B);
    tl.to(".dc-c", { opacity: 1, duration: 0.05 }, 12 * B);
    tl.set(".dc-leak", { opacity: 0 }, 0);
    tl.to(".dc-leak", { opacity: 1, duration: 0.4 }, 8 * B);
    tl.fromTo("#dc-leak1", { x: 0, y: 0 }, { x: 260, y: 300, duration: 4 * B, ease: "sine.inOut" }, 8 * B);
    tl.fromTo("#dc-leak2", { x: 0, y: 0 }, { x: -300, y: -260, duration: 4 * B, ease: "sine.inOut" }, 8 * B);
    tl.to(".dc-leak", { opacity: 0, duration: 0.15 }, 12 * B - 0.1);

    // --- stutter robótico (beat 18): scanlines rosas y tinte que parpadea ---
    tl.set(["#dc-scan", "#dc-tint"], { opacity: 0 }, 0);
    tl.set("#dc-scan", { opacity: 1 }, 18 * B);
    [0, 1, 2].forEach((i) => {
      const t = 18 * B + (i * B) / 3;
      tl.set("#dc-tint", { opacity: 0.35 }, t);
      tl.to("#dc-tint", { opacity: 0, duration: B / 3 - 0.02, ease: "power2.out" }, t + 0.001);
      tl.set("#dc-scan", { y: i % 2 ? 4 : -4 }, t);
    });
    tl.set("#dc-scan", { opacity: 0 }, 19 * B);

    // salida: todo fuera al cortarse la música
    tl.set([".dc-c", "#dc-frame"], { opacity: 0 }, D - 0.02);

    window.__timelines["dance"] = tl;
  </script>
