  <script>
    const tl = gsap.timeline({ paused: true });
    const B = 0.5625;

    // --- Arranque: línea de energía, texto que se escribe y porcentaje (todo determinista) ---
    const bootText = "SOMOTRIX_OS // INICIANDO";
    const boot = document.querySelector("#hk-boot");
    const pct = document.querySelector("#hk-pct");
    const p = { t: 0 };
    tl.to(
      p,
      {
        t: 1,
        duration: 0.42,
        ease: "none",
        onUpdate: () => {
          const n = Math.round(p.t * bootText.length);
          boot.textContent = bootText.slice(0, n) + (n < bootText.length ? "▌" : "");
          pct.textContent = String(Math.round(p.t * 100)).padStart(3, "0") + "%";
        },
      },
      0.04
    );
    tl.fromTo("#hk-grid", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0);
    tl.fromTo("#hk-line", { scaleX: 0, scaleY: 1 }, { scaleX: 1, duration: 0.34, ease: "expo.out" }, 0.04);
    // el "ojo" se abre en el primer golpe
    tl.to("#hk-line", { scaleY: 120, opacity: 0, duration: 0.22, ease: "expo.in" }, B - 0.16);
    tl.to(["#hk-boot", "#hk-pct"], { opacity: 0, scaleX: 1.6, duration: 0.12, ease: "power2.in" }, B - 0.1);
    tl.set(["#hk-black", "#hk-grid"], { opacity: 0 }, B);

    // --- HUD de escaneo sobre los detalles del robot ---
    tl.set(["#hk-c1", "#hk-c2", "#hk-c3", "#hk-c4", "#hk-reticle", "#hk-ruler", "#hk-scan"], { opacity: 0 }, 0);
    tl.fromTo(
      ["#hk-c1", "#hk-c2", "#hk-c3", "#hk-c4"],
      { opacity: 0, scale: 1.5 },
      { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out", stagger: 0.03 },
      B
    );
    tl.set("#hk-ruler", { opacity: 1 }, B);
    tl.fromTo("#hk-ticks", { y: 0 }, { y: -900, duration: 3.375 - B, ease: "none" }, B);
    [
      [B, 3 * B],
      [3 * B, 5 * B],
      [5 * B, 6 * B],
    ].forEach(([a, b]) => {
      tl.set("#hk-scan", { opacity: 1 }, a);
      tl.fromTo("#hk-scan", { y: 160 }, { y: 1760, duration: b - a, ease: "power1.inOut" }, a);
    });
    // retícula: entra, gira y se reubica con cada plano
    tl.set("#hk-reticle", { opacity: 1 }, B);
    tl.fromTo("#hk-reticle", { scale: 2.2, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.4, ease: "expo.out" }, B);
    tl.fromTo("#hk-ring", { rotation: 0 }, { rotation: 220, duration: 3.375 - B, ease: "none" }, B);
    tl.to("#hk-reticle", { x: 120, y: 260, scale: 0.8, duration: 0.25, ease: "expo.out" }, 3 * B);
    tl.to("#hk-reticle", { x: -40, y: -180, scale: 1.1, duration: 0.25, ease: "expo.out" }, 5 * B);
    // lecturas por plano (aparecen con un parpadeo de terminal)
    tl.set(["#hk-r1", "#hk-r2", "#hk-r3"], { opacity: 0 }, 0);
    [
      ["#hk-r1", B, 3 * B],
      ["#hk-r2", 3 * B, 5 * B],
      ["#hk-r3", 5 * B, 6 * B],
    ].forEach(([el, a, b]) => {
      tl.set(el, { opacity: 1 }, a + 0.04);
      tl.set(el, { opacity: 0.2 }, a + 0.08);
      tl.set(el, { opacity: 1 }, a + 0.12);
      tl.fromTo(el, { x: -30 }, { x: 0, duration: 0.3, ease: "expo.out" }, a + 0.04);
      tl.set(el, { opacity: 0 }, b);
    });

    // --- Tarjeta de estudio: SOMOS presenta (barrido de luz que revela el logo) ---
    const c0 = 2 * B; // 1.125
    tl.set(["#hk-scrim", "#hk-card"], { opacity: 0 }, 0);
    tl.to("#hk-scrim", { opacity: 1, duration: 0.3, ease: "power1.out" }, c0 - 0.1);
    tl.set("#hk-card", { opacity: 1 }, c0);
    tl.fromTo("#hk-logo-wrap", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.inOut" }, c0);
    tl.fromTo("#hk-edge", { x: 0, opacity: 1 }, { x: 620, duration: 0.55, ease: "power3.inOut" }, c0);
    tl.to("#hk-edge", { opacity: 0, scaleY: 0.2, duration: 0.15, ease: "power2.in" }, c0 + 0.55);
    tl.fromTo("#hk-logo", { scale: 1.06 }, { scale: 1, duration: 1.6, ease: "power2.out" }, c0);
    tl.fromTo("#hk-presenta", { opacity: 0, scaleX: 1.5 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: "expo.out" }, c0 + 0.35);
    // salida en glitch justo antes del giro de cabeza
    const g0 = 5 * B - 0.12;
    [0, 0.03, 0.06, 0.09].forEach((d, i) => {
      tl.set("#hk-card", { x: i % 2 ? -26 : 34, skewX: i % 2 ? 14 : -10, opacity: i % 2 ? 0.5 : 1 }, g0 + d);
    });
    tl.set("#hk-card", { x: 0, skewX: 0, opacity: 0 }, 5 * B);
    tl.to("#hk-scrim", { opacity: 0, duration: 0.2 }, 5 * B);

    // salida del hook: todo el HUD se contrae hacia el centro al entrar la playera rosa
    tl.to(["#hk-c1", "#hk-c2", "#hk-c3", "#hk-c4", "#hk-reticle", "#hk-ruler"], { opacity: 0, duration: 0.12, ease: "power2.in" }, 6 * B - 0.12);
    tl.set("#hk-scan", { opacity: 0 }, 6 * B - 0.02);

    window.__timelines["hook"] = tl;
  </script>
