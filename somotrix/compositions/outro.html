<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    /* Cierre: la música se corta, el cuadro se congela con interferencia rosa, paneles robóticos
       pasan de ciruela a rosa SOMOS a blanco y el logo SOMOS se ensambla por franjas. Solo el logo. */
    #ot-slices {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
    .ot-slice {
      position: absolute;
      left: 0;
      width: 1080px;
    }
    #ot-scanlines {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      background-image: repeating-linear-gradient(180deg, rgba(26, 4, 16, 0.4) 0 2px, transparent 2px 6px);
    }
    #ot-tiles {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
    .ot-tile {
      position: absolute;
      width: 120px;
      height: 120px;
      background: #1a0410;
      outline: 3px solid #ff3d9a;
      outline-offset: -3px;
    }
    #ot-white {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      background: #fff;
    }
    #ot-grid {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      background-image: linear-gradient(rgba(230, 8, 114, 0.08) 2px, transparent 2px), linear-gradient(90deg, rgba(230, 8, 114, 0.08) 2px, transparent 2px);
      background-size: 120px 120px;
    }
    .ot-streak {
      position: absolute;
      top: -200px;
      left: -900px;
      height: 2320px;
      transform: skewX(-18deg);
      background: #e60872;
    }
    #ot-s1 {
      width: 150px;
      opacity: 0.12;
    }
    #ot-s2 {
      width: 40px;
      opacity: 0.22;
    }
    #ot-logo {
      position: absolute;
      left: 110px;
      top: 884px;
      width: 860px;
      height: 153px;
    }
    .ot-strip {
      position: absolute;
      left: 0;
      width: 860px;
      overflow: hidden;
    }
    .ot-strip img {
      position: absolute;
      left: 0;
      width: 860px;
      height: 153px;
      display: block;
    }
    .ot-ghost {
      position: absolute;
      left: 0;
      top: 0;
      width: 860px;
      height: 153px;
      -webkit-mask-image: url("assets/brand/somos.png");
      mask-image: url("assets/brand/somos.png");
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
    }
    #ot-ghost-a {
      background: #ff7ab8;
    }
    #ot-ghost-b {
      background: #1a0410;
    }
    #ot-glint {
      position: absolute;
      left: 0;
      top: 0;
      width: 860px;
      height: 153px;
      -webkit-mask-image: url("assets/brand/somos.png");
      mask-image: url("assets/brand/somos.png");
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      overflow: hidden;
    }
    #ot-glint-band {
      position: absolute;
      top: 0;
      left: -300px;
      width: 200px;
      height: 153px;
      background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.9) 50%, rgba(255, 255, 255, 0) 100%);
    }
    #ot-scan {
      position: absolute;
      left: 100px;
      top: 840px;
      width: 8px;
      height: 240px;
      background: #ff3d9a;
      box-shadow: 0 0 20px 6px rgba(255, 61, 154, 0.7);
    }
    /* estados iniciales (el fotograma 0 de la composición no ejecuta los set en 0) */
    .ot-slice,
    #ot-scanlines,
    #ot-white,
    #ot-grid,
    #ot-logo,
    #ot-scan {
      opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="outro" data-width="1080" data-height="1920">
    <div id="ot-slices"></div>
    <div id="ot-scanlines"></div>
    <div id="ot-tiles"></div>
    <div id="ot-white"></div>
    <div id="ot-grid"></div>
    <div id="ot-s1" class="ot-streak"></div>
    <div id="ot-s2" class="ot-streak"></div>
    <div id="ot-logo">
      <div id="ot-ghost-a" class="ot-ghost"></div>
      <div id="ot-ghost-b" class="ot-ghost"></div>
      <div id="ot-strips"></div>
      <div id="ot-glint"><div id="ot-glint-band"></div></div>
    </div>
    <div id="ot-scan"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const D = 4.136;
    const initTiles = () => gsap.set(".ot-tile", { scale: 0 });
    let seed = 23;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

    // ---------- 1) interferencia sobre el cuadro congelado ----------
    const sl = document.querySelector("#ot-slices");
    const COLORS = ["#e60872", "#ffffff", "#1a0410", "#ff3d9a", "#e60872", "#1a0410", "#ffffff", "#ff7ab8"];
    const slices = [];
    let y = 0;
    for (let i = 0; y < 1920; i++) {
      const h = 40 + Math.floor(rnd() * 170);
      const d = document.createElement("div");
      d.className = "ot-slice";
      d.style.top = y + "px";
      d.style.height = h + "px";
      d.style.background = COLORS[i % COLORS.length];
      sl.appendChild(d);
      slices.push({ el: d, dir: i % 2 ? 1 : -1, delay: 0.04 + rnd() * 0.3, keep: rnd() });
      y += h;
    }
    slices.forEach((s) => {
      tl.fromTo(s.el, { x: s.dir * 1100, opacity: 0.9 }, { x: s.dir * -40, duration: 0.16, ease: "expo.out", immediateRender: false }, s.delay);
      tl.set(s.el, { opacity: s.keep > 0.5 ? 0.85 : 0 }, s.delay + 0.18);
      tl.set(s.el, { opacity: 0 }, s.delay + 0.26);
    });
    tl.fromTo("#ot-scanlines", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 0);

    // ---------- 2) paneles: ciruela → rosa SOMOS → blanco ----------
    const tiles = document.querySelector("#ot-tiles");
    for (let r = 0; r < 16; r++) {
      for (let c = 0; c < 9; c++) {
        const t = document.createElement("div");
        t.className = "ot-tile";
        t.style.left = c * 120 + "px";
        t.style.top = r * 120 + "px";
        tiles.appendChild(t);
      }
    }
    initTiles();
    const P0 = 0.22;
    const G = { grid: [16, 9], from: "center", amount: 0.3 };
    tl.set(".ot-tile", { scale: 0 }, 0);
    tl.to(".ot-tile", { scale: 1, duration: 0.14, ease: "expo.out", stagger: G }, P0);
    tl.to(".ot-tile", { backgroundColor: "#e60872", outlineColor: "#ff7ab8", duration: 0.08, ease: "none", stagger: G }, P0 + 0.12);
    tl.to(".ot-tile", { backgroundColor: "#ffffff", outlineColor: "#ffffff", duration: 0.1, ease: "none", stagger: G }, P0 + 0.26);
    tl.to("#ot-scanlines", { opacity: 0, duration: 0.1 }, P0 + 0.4);
    const W0 = 0.84; // todo blanco = 26.70 s (la base también pasa a blanco)
    tl.set("#ot-white", { opacity: 0 }, 0);
    tl.set("#ot-white", { opacity: 1 }, W0);
    tl.set("#ot-tiles", { opacity: 0 }, W0 + 0.01);
    tl.set("#ot-grid", { opacity: 0 }, 0);
    tl.to("#ot-grid", { opacity: 1, duration: 0.2 }, W0);
    tl.to("#ot-grid", { opacity: 0, duration: 1.0, ease: "power1.in" }, W0 + 0.9);
    tl.fromTo("#ot-s1", { x: 0 }, { x: 2400, duration: 0.8, ease: "power2.inOut" }, W0 + 0.05);
    tl.fromTo("#ot-s2", { x: 0 }, { x: 2400, duration: 0.65, ease: "power2.inOut" }, W0 + 0.15);

    // ---------- 3) logo SOMOS ensamblado por franjas ----------
    const strips = document.querySelector("#ot-strips");
    const NS = 6;
    const S = [];
    for (let i = 0; i < NS; i++) {
      const w = document.createElement("div");
      w.className = "ot-strip";
      const top = Math.round((i * 153) / NS);
      const bot = Math.round(((i + 1) * 153) / NS);
      w.style.top = top + "px";
      w.style.height = bot - top + "px";
      const img = document.createElement("img");
      img.src = "assets/brand/somos.png";
      img.alt = "";
      img.style.top = -top + "px";
      w.appendChild(img);
      strips.appendChild(w);
      S.push(w);
    }
    const L0 = W0 + 0.02;
    tl.set("#ot-logo", { opacity: 0 }, 0);
    tl.set("#ot-logo", { opacity: 1 }, L0);
    S.forEach((w, i) => {
      tl.fromTo(w, { x: (i % 2 ? 1 : -1) * (700 + i * 60) }, { x: 0, duration: 0.42, ease: "expo.out" }, L0 + i * 0.045);
    });
    tl.fromTo("#ot-ghost-a", { x: -28, opacity: 0.95 }, { x: 0, opacity: 0, duration: 0.7, ease: "expo.out" }, L0 + 0.25);
    tl.fromTo("#ot-ghost-b", { x: 22, opacity: 0.55 }, { x: 0, opacity: 0, duration: 0.7, ease: "expo.out" }, L0 + 0.25);
    [0.52, 0.6, 0.66].forEach((d, k) => tl.set("#ot-logo", { x: k % 2 ? -8 : 10 }, L0 + d));
    tl.set("#ot-logo", { x: 0 }, L0 + 0.72);
    tl.fromTo("#ot-logo", { scale: 1.05 }, { scale: 1, duration: D - L0, ease: "power2.out" }, L0);
    tl.set("#ot-scan", { opacity: 0 }, 0);
    tl.set("#ot-scan", { opacity: 1 }, L0 + 0.5);
    tl.fromTo("#ot-scan", { x: 0 }, { x: 880, duration: 0.45, ease: "power2.inOut" }, L0 + 0.5);
    tl.to("#ot-scan", { opacity: 0, duration: 0.1 }, L0 + 0.95);
    tl.fromTo("#ot-glint-band", { x: 0 }, { x: 1300, duration: 0.7, ease: "power2.inOut" }, 2.55);

    window.__timelines["outro"] = tl;
  </script>
</template>
