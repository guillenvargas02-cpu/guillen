    #ot-slices {

    .ot-slice {

    /* 3) logo SOMOS sobre blanco, ensamblado por franjas */
    #ot-logo {

    .ot-strip {

    #ot-glint-band {

      position: absolute;

  </style>
  <div id="root" data-composition-id="outro" data-width="1080" data-height="1920">
    <div id="ot-b1" class="ot-br"></div>
    <div id="ot-b2" class="ot-br"></div>
    <div id="ot-b3" class="ot-br"></div>
    <div id="ot-b4" class="ot-br"></div>
    <div id="ot-status" class="mono" data-layout-ignore></div>
    <div id="ot-slices"></div>
    <div id="ot-scanlines"></div>
    <div id="ot-tiles"></div>
    <div id="ot-white"></div>
    <div id="ot-grid"></div>
    <div id="ot-logo">
      <div id="ot-ghost-c" class="ot-ghost"></div>
      <div id="ot-ghost-n" class="ot-ghost"></div>
      <div id="ot-strips"></div>
      <div id="ot-glint"><div id="ot-glint-band"></div></div>
    </div>
    <div id="ot-scan"></div>
    <div id="ot-name"></div>
    <div id="ot-rule"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const D = 4.125;
    let seed = 23;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

    // ---------- 1) cámara lenta: fijación rápida + "DESCONECTANDO" ----------
    const st = document.querySelector("#ot-status");
    const STATUS = "SOMOTRIX_01 // FIN DE DEMO";
    tl.fromTo(".ot-br", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out", stagger: 0.02 }, 0.05);
    const a = { t: 0 };
    tl.to(
      a,
      {
        t: 1,
        duration: 0.5,
        ease: "none",
        onUpdate: () => {
          const n = Math.round(a.t * STATUS.length);
          st.textContent = STATUS.slice(0, n) + (n < STATUS.length ? "▌" : "");
        },
      },
      0.2
    );
    tl.set([".ot-br", "#ot-status"], { opacity: 0 }, 1.08);

    // ---------- 2) interferencia (26.95 s): barras de color que barren el cuadro ----------
    const G0 = 1.075;
    const sl = document.querySelector("#ot-slices");
    const COLORS = ["#3ef0ff", "#e60872", "#070b1a", "#ffffff", "#3ef0ff", "#070b1a", "#e60872", "#070b1a"];
    const slices = [];
    let y = 0;
    for (let i = 0; y < 1920; i++) {
      const h = 40 + Math.floor(rnd() * 180);
      const d = document.createElement("div");
      d.className = "ot-slice";
      d.style.top = y + "px";
      d.style.height = h + "px";
      d.style.background = COLORS[i % COLORS.length];
      d.style.opacity = "0";
      sl.appendChild(d);
      slices.push({ el: d, dir: i % 2 ? 1 : -1, delay: rnd() * 0.25, keep: rnd() });
      y += h;
    }
    slices.forEach((s) => {
      tl.fromTo(s.el, { x: s.dir * 1100, opacity: 0.9 }, { x: s.dir * -40, duration: 0.18, ease: "expo.out", immediateRender: false }, G0 + s.delay);
      tl.set(s.el, { opacity: s.keep > 0.5 ? 0.85 : 0 }, G0 + s.delay + 0.2);
      tl.set(s.el, { opacity: 0 }, G0 + s.delay + 0.3);
    });
    tl.set(".ot-slice", { opacity: 0 }, 0);
    tl.fromTo("#ot-scanlines", { opacity: 0 }, { opacity: 1, duration: 0.1 }, G0);

    // ---------- 2b) paneles robóticos: azul noche → rosa SOMOS → blanco ----------
    const tiles = document.querySelector("#ot-tiles");
    for (let r = 0; r < 16; r++) {
      for (let c = 0; c < 9; c++) {
        const t = document.createElement("div");
        t.className = "ot-tile";
        t.style.left = c * 120 + "px";
        t.style.top = r * 120 + "px";
        tiles.appendChild(t);
      }
    }
    const P0 = 1.3;
    tl.set(".ot-tile", { scale: 0, opacity: 1 }, 0);
    tl.to(".ot-tile", { scale: 1, duration: 0.16, ease: "expo.out", stagger: { grid: [16, 9], from: "center", amount: 0.32 } }, P0);
    tl.to(".ot-tile", { backgroundColor: "#e60872", outlineColor: "#ff6fb1", duration: 0.1, ease: "none", stagger: { grid: [16, 9], from: "center", amount: 0.32 } }, P0 + 0.14);
    tl.to(".ot-tile", { backgroundColor: "#ffffff", outlineColor: "#ffffff", duration: 0.12, ease: "none", stagger: { grid: [16, 9], from: "center", amount: 0.32 } }, P0 + 0.3);
    tl.to("#ot-scanlines", { opacity: 0, duration: 0.1 }, P0 + 0.45);
    const W0 = P0 + 0.78; // todo blanco ≈ 27.96 s
    tl.set("#ot-white", { opacity: 0 }, 0);
    tl.set("#ot-white", { opacity: 1 }, W0);
    tl.set("#ot-tiles", { opacity: 0 }, W0 + 0.01);
    tl.fromTo("#ot-grid", { opacity: 0 }, { opacity: 1, duration: 0.2 }, W0 - 0.1);
    tl.to("#ot-grid", { opacity: 0, duration: 1.2, ease: "power1.in" }, W0 + 0.6);

    // ---------- 3) el logo se ensambla por franjas que llegan de lados opuestos ----------
    const strips = document.querySelector("#ot-strips");
    const NS = 6;
    const H = 153;
    const S = [];
    for (let i = 0; i < NS; i++) {
      const w = document.createElement("div");
      w.className = "ot-strip";
      const top = Math.round((i * H) / NS);
      const bot = Math.round(((i + 1) * H) / NS);
      w.style.top = top + "px";
      w.style.height = bot - top + "px";
      const img = document.createElement("img");
      img.src = "assets/brand/somos.png";
      img.alt = "";
      img.style.top = -top + "px";
      w.appendChild(img);
      strips.appendChild(w);
      S.push(w);
    }
    const L0 = W0 - 0.12; // 27.84 s
    tl.set("#ot-logo", { opacity: 0 }, 0);
    tl.set("#ot-logo", { opacity: 1 }, L0);
    S.forEach((w, i) => {
      tl.fromTo(w, { x: (i % 2 ? 1 : -1) * (700 + i * 60) }, { x: 0, duration: 0.42, ease: "expo.out" }, L0 + i * 0.045);
    });
    // fantasmas cian / azul noche que se asientan (aberración cromática)
    tl.fromTo("#ot-ghost-c", { x: -26, opacity: 0.95 }, { x: 0, opacity: 0, duration: 0.7, ease: "expo.out" }, L0 + 0.25);
    tl.fromTo("#ot-ghost-n", { x: 22, opacity: 0.6 }, { x: 0, opacity: 0, duration: 0.7, ease: "expo.out" }, L0 + 0.25);
    // micro-sacudidas de ensamblado mecánico
    [0.52, 0.6, 0.66].forEach((d, k) => {
      tl.set("#ot-logo", { x: k % 2 ? -8 : 10 }, L0 + d);
    });
    tl.set("#ot-logo", { x: 0 }, L0 + 0.72);
    tl.fromTo("#ot-logo", { scale: 1.04 }, { scale: 1, duration: D - L0, ease: "power2.out" }, L0);
    // línea de escaneo que verifica el logo
    tl.set("#ot-scan", { opacity: 0 }, 0);
    tl.set("#ot-scan", { opacity: 1 }, L0 + 0.5);
    tl.fromTo("#ot-scan", { x: 0 }, { x: 880, duration: 0.45, ease: "power2.inOut" }, L0 + 0.5);
    tl.to("#ot-scan", { opacity: 0, duration: 0.1 }, L0 + 0.95);
    // brillo final sobre las letras
    tl.fromTo("#ot-glint-band", { x: 0 }, { x: 1300, duration: 0.7, ease: "power2.inOut" }, D - 1.1);

    // nombre del robot bajo el logo: se decodifica
    const nm = document.querySelector("#ot-name");
    const NAME = "SOMOTRIX";
    const GLY = "01<>/#X%";
    const tab = Array.from({ length: 20 }, () => Array.from({ length: 8 }, () => GLY[Math.floor(rnd() * GLY.length)]));
    const n = { t: 0 };
    tl.set("#ot-name", { opacity: 0 }, 0);
    tl.set("#ot-name", { opacity: 1 }, L0 + 0.7);
    tl.to(
      n,
      {
        t: 1,
        duration: 0.45,
        ease: "none",
        onUpdate: () => {
          const f = Math.floor(n.t * 19);
          nm.textContent = NAME.split("")
            .map((ch, i) => (n.t * NAME.length > i + 0.5 ? ch : tab[f][i]))
            .join("");
        },
      },
      L0 + 0.7
    );
    tl.fromTo("#ot-rule", { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, L0 + 0.8);

    window.__timelines["outro"] = tl;
  </script>
