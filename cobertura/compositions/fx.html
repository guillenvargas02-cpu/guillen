<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .fx-bar {
      position: absolute;
      left: 0;
      width: 1080px;
      height: 962px;
      background: #000;
      transform: scaleY(0);
    }
    #fx-barT {
      top: 0;
      transform-origin: 50% 0%;
    }
    #fx-barB {
      top: 958px;
      transform-origin: 50% 100%;
    }
    .fx-wipe {
      position: absolute;
      left: -300px;
      top: -200px;
      width: 820px;
      height: 2320px;
      background: #e4007c;
      transform: skewX(-14deg) translateX(-1500px);
    }
    .fx-wipe-w {
      background: #fff;
      width: 140px;
    }
    #fx-flash {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      background: #fff;
      opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="fx" data-width="1080" data-height="1920">
    <div id="fx-barT" class="fx-bar" data-layout-ignore></div>
    <div id="fx-barB" class="fx-bar" data-layout-ignore></div>
    <div id="fx-wipe" class="fx-wipe" data-layout-ignore></div>
    <div id="fx-wipew" class="fx-wipe fx-wipe-w" data-layout-ignore></div>
    <div id="fx-flash" data-layout-ignore></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const B = 60 / 124, D1 = 2.68;
    const g = (n) => D1 + n * B;
    const DUMP = g(16), B_IN = g(36), R_IN = g(44), LOGO = g(50);
    tl.set("#fx-flash", { opacity: 0 }, 0);
    tl.set(["#fx-barT", "#fx-barB"], { scaleY: 0 }, 0);

    // Destellos en los cortes (fuerte en los golpes, sutil en la ráfaga)
    [[D1, 0.7, 0.4], [g(4), 0.35, 0.22], [g(8), 0.4, 0.22], [g(10), 0.35, 0.22], [g(12), 0.35, 0.22],
     [g(34), 0.35, 0.22], [R_IN, 0.55, 0.3], [LOGO, 0.85, 0.3]].forEach(([t, a, d]) => {
      tl.set("#fx-flash", { opacity: a }, t);
      tl.to("#fx-flash", { opacity: 0, duration: d, ease: "power2.out" }, t + 0.001);
    });

    // Barrido rosa de marca que tapa el paso al photo dump
    tl.fromTo("#fx-wipe", { x: -1500 }, { x: 1900, duration: 0.44, ease: "power3.inOut" }, DUMP - 0.24);
    tl.fromTo("#fx-wipew", { x: -1700 }, { x: 2100, duration: 0.48, ease: "power3.inOut" }, DUMP - 0.22);

    window.__timelines["fx"] = tl;
  </script>
</template>
