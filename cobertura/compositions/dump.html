    const tl = gsap.timeline({ paused: true });
    const B = 60 / 124;
    const T0 = 0; // el clip arranca en el fotograma 313 (10.433 s), sobre el inicio de frase de 10.422 s
    const k = (n) => T0 + n * B;
    const FULL = 1080 / 558; // escala a la que la foto de una copia llena el cuadro

    const flash = (t, a, d) => {
      tl.set("#d-flash", { opacity: a }, t);
      tl.to("#d-flash", { opacity: 0, duration: d, ease: "power2.out" }, t + 0.001);
    };
    const shutter = (t) => {
      tl.to(["#d-shT", "#d-shB"], { scaleY: 1, duration: 0.07, ease: "power2.in" }, t - 0.07);
      tl.to(["#d-shT", "#d-shB"], { scaleY: 0, duration: 0.13, ease: "power2.out" }, t);
      flash(t, 0.55, 0.28);
    };

    tl.set(["#d-shT", "#d-shB"], { scaleY: 0 }, 0);
    tl.fromTo("#d-mark", { x: 0 }, { x: -220, duration: 7.84, ease: "none" }, 0);

    // 1. Golpe 2: fotos a pantalla completa, una cada 2 beats, con obturador y fecha de cámara
    tl.set("#d-f1", { visibility: "visible" }, 0);
    flash(0, 1, 0.45);
    tl.fromTo("#d-date", { opacity: 0 }, { opacity: 0.95, duration: 0.2 }, 0.15);
    [["#d-f1i", 0, -18], ["#d-f2i", 2, 18], ["#d-f3i", 4, -14]].forEach(([id, n, dx]) => {
      tl.fromTo(id, { scale: 1.14, x: -dx }, { scale: 1.03, x: dx, duration: 2 * B + 0.1, ease: "power1.out" }, k(n));
    });
    tl.set("#d-f2", { visibility: "visible" }, k(2));
    tl.set("#d-f1", { visibility: "hidden" }, k(2));
    shutter(k(2));
    tl.set("#d-f3", { visibility: "visible" }, k(4));
    tl.set("#d-f2", { visibility: "hidden" }, k(4));
    shutter(k(4));
    // la cuarta foto ya es una copia impresa, vista tan de cerca que llena el cuadro
    tl.set("#d-p1", { visibility: "visible", scale: FULL, rotation: 0, x: 0, y: 0 }, k(6));
    tl.set("#d-f3", { visibility: "hidden" }, k(6));
    tl.fromTo("#d-p1i", { scale: 1.12 }, { scale: 1, duration: 2 * B, ease: "power1.inOut" }, k(6));
    shutter(k(6));
    tl.to("#d-date", { opacity: 0, duration: 0.12 }, k(8) - 0.05);

    // 2. Se aleja: es una foto sobre la mesa rosa, y van cayendo más, cada vez más rápido

    const drops = [
      ["#d-p2", 9, 60, 40, 6],
      ["#d-p3", 10, -70, 60, -4],
      ["#d-p4", 11, 50, -50, 9],
      ["#d-p5", 12, -30, 20, -10],
      ["#d-p6", 12.5, 70, 30, 4],
      ["#d-p7", 13, -50, -40, 7],
    ];
    drops.forEach(([id, n, x, y, r]) => {
      tl.set(id, { visibility: "visible" }, k(n));
      tl.fromTo(id, { scale: 1.5, rotation: r + (r > 0 ? 14 : -14), x: x * 3, y: y - 160, opacity: 0 },
        { scale: 1, rotation: r, x, y, opacity: 1, duration: 0.42, ease: "expo.out" }, k(n));
      flash(k(n), 0.32, 0.2);
    });
    // la copia 1 queda debajo de las nuevas
    tl.set("#d-p1", { zIndex: 1 }, k(8.9));
    tl.to("#d-p1", { scale: 1.05, x: -42, y: -31.5, duration: k(14) - k(8) - 0.6, ease: "none" }, k(8) + 0.6);
    tl.fromTo("#d-stack", { scale: 1 }, { scale: 1.05, duration: k(14) - k(8), ease: "none" }, k(8));

    // 3. Última copia: el gesto. Cae derecha y la cámara entra en ella hasta que es video
    tl.set("#d-p8", { visibility: "visible" }, k(13.5));
    tl.fromTo("#d-p8", { scale: 1.5, rotation: -14, x: 0, y: -160, opacity: 0 },
      { scale: 1, rotation: -2, x: 0, y: 0, opacity: 1, duration: 0.42, ease: "expo.out" }, k(13.5));
    flash(k(13.5), 0.4, 0.22);
    const zEnd = 7.7; // fotograma 544; en el 545 (18.167 s) base.mp4 ya muestra esta misma toma
    tl.to("#d-p8", { scale: FULL, rotation: 0, x: 0, y: 0, duration: zEnd - k(14), ease: "power3.inOut" }, k(14));
