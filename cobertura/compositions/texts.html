<template>
  <style>
    @font-face {
      font-family: "SOMOS Serif";
      src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
      font-weight: 400;
      font-style: italic;
    }
    @font-face {
      font-family: "SOMOS Sans";
      src: url("assets/fonts/Archivo-SemiBold.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    /* Sombra suave abajo para que el texto respire sobre el footage */
    #t-scrim {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 52%, rgba(10, 0, 5, 0.34) 72%, rgba(10, 0, 5, 0.62) 100%);
      opacity: 0;
    }
    .grp {
      position: absolute;
      left: 0;
      width: 1080px;
      opacity: 0;
      color: #fff;
    }
    .left {
      padding-left: 88px;
    }
    .center {
      text-align: center;
    }
    .center .cap {
      transform-origin: 50% 50%;
    }
    .cap {
      display: block;
      transform-origin: 0% 50%;
      font-family: "SOMOS Sans", sans-serif;
      font-weight: 600;
      font-size: 30px;
      line-height: 1;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
    }
    .big {
      display: block;
      font-family: "SOMOS Serif", serif;
      font-style: italic;
      font-weight: 400;
      line-height: 1.02;
      letter-spacing: -0.01em;
      text-shadow: 0 6px 40px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
    }
    /* Cada palabra sube desde una máscara */
    .mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: top;
      padding: 0.04em 0.14em 0.16em 0.06em;
      margin: -0.04em -0.14em -0.16em -0.06em;
    }
    .mask > span {
      display: inline-block;
    }
    .dot {
      color: #ff2d8f;
    }
    #t1-swap {
      position: relative;
      height: 190px;
    }
    #t1-swap .mask {
      position: absolute;
      left: 0;
      top: 0;
    }
  </style>
  <div id="root" data-composition-id="texts" data-width="1080" data-height="1920">
    <!-- Textos: en plural, sobre lo que compartimos y hacia dónde vamos. Entradas en versalitas
         (Archivo) y palabras clave en Instrument Serif itálica; todo cae en los beats. -->
    <div id="t-scrim" data-layout-ignore></div>

    <div id="t1" class="grp left" style="top: 1268px">
      <span class="cap" id="t1-cap">Compartimos</span>
      <span class="big" id="t1-a" style="font-size: 116px; margin-top: 22px"><span class="mask"><span>nuestras</span></span></span>
      <div id="t1-swap" class="big" style="font-size: 160px">
        <span class="mask" id="t1-w0"><span>causas<span class="dot">,</span></span></span>
        <span class="mask" id="t1-w1"><span>ideas<span class="dot">,</span></span></span>
        <span class="mask" id="t1-w2"><span>inquietudes</span></span>
      </div>
    </div>

    <div id="t2" class="grp left" style="top: 1344px">
      <span class="cap" id="t2-cap">Y lo que queremos</span>
      <span class="big" style="font-size: 156px; margin-top: 22px"><span class="mask"><span>para</span></span> <span class="mask"><span>México<span class="dot">.</span></span></span></span>
    </div>

    <div id="t3" class="grp center" style="top: 150px">
      <span class="cap" id="t3-cap">Una nueva</span>
      <span class="big" style="font-size: 112px; margin-top: 18px"><span class="mask"><span>opción</span></span> <span class="mask"><span>ciudadana.</span></span></span>
    </div>

    <div id="t4" class="grp left" style="top: 1344px">
      <span class="cap" id="t4-cap">Para que el poder</span>
      <span class="big" style="font-size: 150px; margin-top: 22px"><span class="mask"><span>sea</span></span> <span class="mask"><span>ciudadano<span class="dot">.</span></span></span></span>
    </div>

    <!-- En la franja de cine de abajo, durante el quiebre de bajo -->
    <div id="t5" class="grp center" style="top: 1736px">
      <span class="cap" id="t5-cap" style="font-size: 24px">Queremos</span>
      <span class="big" id="t5-big" style="font-size: 92px; margin-top: 12px"><span class="mask"><span>llegar</span></span> <span class="mask"><span>lejos<span class="dot">.</span></span></span></span>
    </div>

    <div id="t6" class="grp center" style="top: 1320px">
      <span class="cap" id="t6-cap">Esto apenas</span>
      <span class="big" id="t6-big" style="font-size: 176px; margin-top: 18px"><span class="mask"><span>comienza<span class="dot">.</span></span></span></span>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const B = 60 / 124, D1 = 2.68;
    const g = (n) => D1 + n * B;
    const R_IN = g(44), LOGO = g(50);

    const show = (grp, t) => tl.set(grp, { opacity: 1 }, t);
    const capIn = (sel, t) =>
      tl.fromTo(sel, { opacity: 0, scaleX: 1.35, y: 8, filter: "blur(6px)" },
        { opacity: 0.92, scaleX: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "power3.out" }, t);
    const wordsIn = (sel, t, stagger = 0.09) =>
      tl.fromTo(sel, { yPercent: 118, filter: "blur(10px)" },
        { yPercent: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out", stagger }, t);
    const out = (grp, t, d = 0.32) =>
      tl.to(grp, { opacity: 0, y: -16, filter: "blur(8px)", duration: d, ease: "power2.in" }, t);
    const scrim = (a, b) => {
      tl.to("#t-scrim", { opacity: 1, duration: 0.45, ease: "sine.out" }, a);
      tl.to("#t-scrim", { opacity: 0, duration: 0.4, ease: "sine.in" }, b);
    };

    // 1. "Compartimos nuestras causas, ideas, inquietudes" — la última palabra cambia en el beat
    scrim(g(1) - 0.2, g(16) - 0.4);
    show("#t1", g(1));
    capIn("#t1-cap", g(1));
    wordsIn("#t1-a .mask > span", g(2));
    wordsIn("#t1-w0 > span", g(2) + 0.1);
    [["#t1-w0", "#t1-w1", g(4)], ["#t1-w1", "#t1-w2", g(6)]].forEach(([a, b, t]) => {
      tl.to(`${a} > span`, { yPercent: -118, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, t - 0.2);
      wordsIn(`${b} > span`, t);
    });
    out("#t1", g(8) + 0.15);

    // 2. "Y lo que queremos para México."
    show("#t2", g(9));
    capIn("#t2-cap", g(9));
    wordsIn("#t2 .mask > span", g(10));
    out("#t2", g(16) - 0.36);

    // 3. Photo dump, sobre el rosa: "Una nueva opción ciudadana."
    show("#t3", g(25));
    capIn("#t3-cap", g(25));
    wordsIn("#t3 .mask > span", g(26));
    out("#t3", g(30) - 0.2);

    // 4. "Para que el poder sea ciudadano."
    scrim(g(33) - 0.2, g(36) - 0.2);
    show("#t4", g(33));
    capIn("#t4-cap", g(33));
    wordsIn("#t4 .mask > span", g(34));
    out("#t4", g(36) - 0.18, 0.2);

    // 5. Quiebre de bajo: "Queremos llegar lejos." en la franja de cine; queda solo sobre el negro
    show("#t5", g(39));
    capIn("#t5-cap", g(39));
    wordsIn("#t5 .mask > span", g(40), 0.22);
    tl.fromTo("#t5-big", { scale: 1 }, { scale: 1.07, duration: R_IN - g(40), ease: "none" }, g(40));
    tl.set("#t5", { opacity: 0 }, R_IN);

    // 6. Fin de la ráfaga: "Esto apenas comienza." y el logo
    scrim(g(47) - 0.2, LOGO - 0.1);
    show("#t6", g(47));
    capIn("#t6-cap", g(47));
    wordsIn("#t6 .mask > span", g(48));
    tl.fromTo("#t6-big", { scale: 1.1 }, { scale: 1, duration: 0.97, ease: "power2.out" }, g(48));
    out("#t6", LOGO - 0.12, 0.12);
    window.__timelines["texts"] = tl;
  </script>
</template>
