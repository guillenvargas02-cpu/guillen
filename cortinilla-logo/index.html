<!doctype html>
<html
  lang="es"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Fondo","default":"#FFFFFF"},
    {"id":"color-accent","type":"color","label":"Rosa cívico","default":"#E4007C"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Cortinilla SOMOS · hook con el logotipo. 4 s, vertical; render 2160x3840 a 60 fps. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-fps="60" data-motion-blur="on" data-width="1080" data-height="1920">
      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Sonido (Pixabay, ver assets/sfx/CREDITS.md): whooshes en los cortes del montaje, el whoosh largo
           cresta al entrar a la O (1.85 s) y el golpe con crescendo cae en el impacto del logotipo (2.35 s). -->
      <audio id="sfx-cut1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.24" data-duration="0.575" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-cut2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.56" data-duration="0.575" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-cut3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.86" data-duration="0.575" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-dive" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="0.9" data-media-start="1.55" data-duration="2.4" data-track-index="6" data-volume="0.55" data-fade-in="0.2" data-fade-out="0.5"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="0.364" data-duration="2.592" data-track-index="7" data-volume="0.5" data-fade-out="0.6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
